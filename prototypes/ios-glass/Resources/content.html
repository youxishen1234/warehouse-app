<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"><style>
:root{--dock-inset:120px;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:15px -apple-system,sans-serif}main{max-width:496px;margin:auto;padding:20px 16px var(--dock-inset)}h1{font-size:30px;margin:0 0 8px}p{line-height:1.6}.lead{color:#a7b0c0;font-size:13px}.tile{border-radius:20px;padding:22px;margin:16px 0;min-height:160px;border:1px solid #2d3440;background:#17191d;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 30px #0008}.tile strong{font-size:34px;font-variant-numeric:tabular-nums}.tile:nth-child(3n){background:#142a4d;color:#f5f8ff}.tile:nth-child(3n+1){background:#202634;color:#fff}.tile:nth-child(3n+2){background:#102f3b;color:#fff}button{font:inherit;border:0;border-radius:12px;padding:14px 20px;background:#087ff5;color:white;min-height:44px}.last{width:100%;margin-top:16px}.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:24px}.overlay[hidden]{display:none}.dialog{background:#1b1d22;color:#fff;padding:24px;border-radius:24px;width:100%;max-width:400px}.dialog button{width:100%}
</style></head><body><main id="content"></main><div class="overlay" id="overlay" hidden role="dialog" aria-label="测试弹层" aria-modal="true"><div class="dialog"><h2>打印预览</h2><p>模态打开时，原生底栏隐藏。关闭后恢复正确路由和底部留白。</p><button id="close">关闭弹层</button></div></div><script>
 let route='home',modal=false,sequence=0,requestId=null,handshakeTimer=null;
const titles={home:'曙光库存',inbound:'纸板入库',outbound:'销售出库',mine:'我的',detail:'单据详情'};
 function send(){window.webkit.messageHandlers.dockState.postMessage({epoch:window.prototypeEpoch,sequence:++sequence,ready:true,route,modal,requestId})}
 function beginHandshake(){if(handshakeTimer!==null)clearInterval(handshakeTimer);window.__nativeHandshakeAck=false;send();handshakeTimer=setInterval(()=>{if(window.__nativeHandshakeAck){clearInterval(handshakeTimer);handshakeTimer=null}else send()},500)}
function render(){document.querySelector('#content').innerHTML='<h1>'+titles[route]+'</h1><p class="lead">今日业务流<br>向上滚动，观察颜色、文字与线条经过玻璃的变化。</p>'+Array.from({length:16},(_,i)=>'<article class="tile"><span>业务流 · 记录 '+String(i+1).padStart(2,'0')+' · '+titles[route]+'</span><strong>'+((i+1)*120).toLocaleString()+' 张</strong><span>1550 × 705 / A　｜　曙光纸板</span></article>').join('')+'<button class="last" id="last-action">末条操作 · 不应被遮挡</button>';document.querySelector('#last-action').onclick=()=>{document.querySelector('#last-action').textContent='末条操作已响应'};beginHandshake()}
window.setDockInset=value=>document.documentElement.style.setProperty('--dock-inset',value+'px');
window.addEventListener('native-tab',event=>{route=event.detail.route;requestId=event.detail.requestId;modal=false;document.querySelector('#overlay').hidden=true;render();scrollTo(0,0)});
window.openPreviewModal=()=>{modal=true;document.querySelector('#overlay').hidden=false;send()};
window.openDetail=()=>{route='detail';modal=false;requestId=null;render();scrollTo(0,0)};
document.querySelector('#close').onclick=()=>{modal=false;document.querySelector('#overlay').hidden=true;send()};
window.addEventListener('error',()=>{document.title='PROTOTYPE_JS_ERROR'});render();
</script></body></html>
