<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"><style>
:root{--dock-inset:120px;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:#f6f8fa;color:#0f172a;font:15px -apple-system,sans-serif}main{max-width:496px;margin:auto;padding:20px 16px var(--dock-inset)}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6}.lead{color:#475569;font-size:13px}.tile{border-radius:20px;padding:22px;margin:16px 0;min-height:160px;border:1px solid #e5eaf0;background:white;display:flex;flex-direction:column;justify-content:space-between}.tile strong{font-size:34px;font-variant-numeric:tabular-nums}.tile:nth-child(3n){background:#0f766e;color:white}.tile:nth-child(3n+1){background:#ffedd5;color:#7c2d12}.tile:nth-child(3n+2){background:#dbeafe;color:#1e3a8a}button{font:inherit;border:0;border-radius:12px;padding:14px 20px;background:#0f766e;color:white;min-height:44px}.last{width:100%;margin-top:16px}.overlay{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:24px}.overlay[hidden]{display:none}.dialog{background:#fff;color:#0f172a;padding:24px;border-radius:24px;width:100%;max-width:400px}.dialog button{width:100%}@media(prefers-color-scheme:dark){body{background:#0f172a;color:#f1f5f9}.lead{color:#cbd5e1}.tile{border-color:#334155}.dialog{background:#172334;color:#f1f5f9}}
</style></head><body><main id="content"></main><div class="overlay" id="overlay" hidden role="dialog" aria-label="测试弹层" aria-modal="true"><div class="dialog"><h2>打印预览</h2><p>模态打开时，原生底栏隐藏。关闭后恢复正确路由和底部留白。</p><button id="close">关闭弹层</button></div></div><script>
let route='home',modal=false,sequence=0,requestId=null;
const titles={home:'曙光库存',inbound:'纸板入库',outbound:'销售出库',mine:'我的',detail:'单据详情'};
function send(){window.webkit.messageHandlers.dockState.postMessage({epoch:window.prototypeEpoch,sequence:++sequence,ready:true,route,modal,requestId})}
function render(){document.querySelector('#content').innerHTML='<h1>'+titles[route]+'</h1><p class="lead">独立原生底栏原型 · 演示数据<br>向上滚动，观察颜色、文字与线条经过玻璃的变化。</p>'+Array.from({length:16},(_,i)=>'<article class="tile"><span>流转记录 '+String(i+1).padStart(2,'0')+' · '+titles[route]+'</span><strong>'+((i+1)*120).toLocaleString()+' 张</strong><span>1550 × 705 / A　｜　曙光纸板</span></article>').join('')+'<button class="last" id="last-action">末条操作 · 不应被遮挡</button>';document.querySelector('#last-action').onclick=()=>{document.querySelector('#last-action').textContent='末条操作已响应'};send()}
window.setDockInset=value=>document.documentElement.style.setProperty('--dock-inset',value+'px');
window.addEventListener('native-tab',event=>{route=event.detail.route;requestId=event.detail.requestId;modal=false;document.querySelector('#overlay').hidden=true;render();scrollTo(0,0)});
window.openPreviewModal=()=>{modal=true;document.querySelector('#overlay').hidden=false;send()};
window.openDetail=()=>{route='detail';modal=false;requestId=null;render();scrollTo(0,0)};
document.querySelector('#close').onclick=()=>{modal=false;document.querySelector('#overlay').hidden=true;send()};
window.addEventListener('error',()=>{document.title='PROTOTYPE_JS_ERROR'});render();
</script></body></html>
