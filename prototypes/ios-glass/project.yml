name: GlassPrototype
options:
  deploymentTarget:
    iOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  GlassPrototype:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 曙光库存
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuguang.glassprototype
  GlassPrototypeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: GlassPrototype
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shuguang.glassprototype.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GlassPrototype:
    build:
      targets:
        GlassPrototype: all
    test:
      targets:
        - GlassPrototypeUITests
