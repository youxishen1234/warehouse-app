<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曙光送货单打印</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">曙</div><div><small>曙光库存 · 桌面工具</small><h1>送货单打印</h1></div><span class="tag">项目原模板 · 241 × 93 mm</span></header>
<main><section class="editor"><div class="heading"><h2>单据资料</h2><button id="sample">填入样单</button></div><p class="hint">只生成打印单据，不改变库存或客户账款。</p><label>公司名称<input id="company" value="东光县曙光纸箱包装" maxlength="50"></label><div class="two"><label>收货单位<input id="party" maxlength="200" placeholder="填写客户名称"></label><label>送货日期<input id="date" type="date"></label></div><label>收货地址<input id="address" maxlength="300" placeholder="选填"></label><div class="two"><label>收货人<input id="receiver" maxlength="100"></label><label>送货人<input id="sender" maxlength="100"></label></div>
<div class="heading"><h2>货物明细</h2><button id="add">＋ 添加一行</button></div><div id="items"></div><div class="amount">整单合计 <strong id="total">¥0.00</strong></div><label class="check"><input id="prices" type="checkbox" checked>打印单价和金额</label><p class="hint">超过一页会使用项目原规则自动分页；每行单位为“个”。</p></section>
<section class="preview-panel"><div class="heading"><div><h2>打印预览</h2><p class="hint">8 列明细 · 大写合计 · 收货 / 送货签字</p></div><button id="preview">更新预览</button></div><div id="stage"><iframe id="frame" sandbox="allow-same-origin" title="送货单打印预览"></iframe></div><div class="printer-box"><div class="heading"><h2>本机打印机</h2><button id="refresh">刷新列表</button></div><select id="printer" aria-label="选择本机打印机"><option>正在读取…</option></select><div class="buttons"><button id="pdf">导出 PDF</button><button id="print" class="primary" disabled>打印一份</button></div><p id="status" role="status">正在读取本机打印机…</p></div></section></main><script src="renderer.js"></script></body></html>
