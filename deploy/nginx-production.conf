# Web releases are switched only by publish-hotupdate.yml through web-current.
server {
    listen 80;
    listen [::]:80;
    server_name youxishen.online www.youxishen.online;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://youxishen.online$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name youxishen.online www.youxishen.online;
    ssl_certificate /etc/letsencrypt/live/youxishen.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youxishen.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host = www.youxishen.online) { return 308 https://youxishen.online$request_uri; }
    client_max_body_size 25m;
    root /opt/shuguang/public/web-current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'nonce-sg-bootstrap'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://youxishen.online http://localhost:* https://localhost:* http://127.0.0.1:*; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://youxishen.online capacitor://localhost http://localhost:* https://localhost:* http://127.0.0.1:*; worker-src 'self' blob:;" always;

    location ~ ^/(workspace(?:/|$)|web-(?:releases|current)(?:/|$)|(?:print|management|customers)\.html$|legacy-entry\.js$|pages/(?:ai-assistant|business-center|label-print|label-resolver|board-calculator|board-receive|board-detail|board-scan|board-outbound|inbound|outbound|mine|products|records|orders|team|customer-edit|custom-copy|backup|customer-photos|carton-calculator|ledger|board-stock|index)/index$) { return 410; }
    # Only the active web release may supply executable interface assets.
    location ~ ^/(?:js|css|static|assets)/ { try_files $uri =404; }
    location ^~ /preview-pages/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' app:; form-action 'self'; script-src 'self' 'nonce-sg-bootstrap'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://youxishen.online http://localhost:* https://localhost:* http://127.0.0.1:*; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://youxishen.online capacitor://localhost http://localhost:* https://localhost:* http://127.0.0.1:*; worker-src 'self' blob:;" always;
    }
    location = /embed { return 308 /embed/; }
    location ^~ /embed/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' app:; form-action 'self'; script-src 'self' 'nonce-sg-bootstrap'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://youxishen.online http://localhost:* https://localhost:* http://127.0.0.1:*; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://youxishen.online capacitor://localhost http://localhost:* https://localhost:* http://127.0.0.1:*; worker-src 'self' blob:;" always;
        try_files /index.html =404;
    }
    location ~ ^/pages/[a-z-]+/index$ { try_files /index.html @backend; }
    location / { try_files $uri $uri/ @backend; }

    # Keep API, app updates, user uploads, downloads
    # on their existing backend paths; none are copied into a web release.
    location @backend {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
