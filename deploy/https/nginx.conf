# ============================================================
# 曙光仓库 App - 热更新服务器 Nginx HTTPS 配置
# 服务器: 152.136.100.200
# 后端服务: http://127.0.0.1:4000
#
# 使用前请将 yourdomain.com 替换为你的实际域名，
# 并确保域名 A 记录已解析到 152.136.100.200
# ============================================================

# HTTP 80 端口：跳转 HTTPS + 供 certbot 验证
server {
    listen 80;
    server_name youxishen.online;

    # certbot 验证路径（不要删）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 443 端口：反向代理到后端
server {
    listen 443 ssl;
    http2 on;
    server_name youxishen.online;

    # SSL 证书路径（certbot 自动生成）
    ssl_certificate     /etc/letsencrypt/live/youxishen.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/youxishen.online/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 上传大小限制（热更新包可能较大）
    client_max_body_size 500m;

    # 代理超时
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 热更新 API
    location /api/appupdate/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 热更新包静态文件
    location /appupdate/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # 静态文件缓存
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 其余请求代理到后端
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
