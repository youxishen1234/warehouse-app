# Include inside the existing HTTPS server block for youxishen.online.
# Also include in the default port 80 server for HTTP downloads by IP.
# File root matches the upload destination in .github/workflows/build-ios.yml.
location = /shuguang.ipa {
    root /opt/shuguang/public;
    try_files $uri =404;
    types { }
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="shuguang.ipa"';
    add_header Cache-Control "no-cache";
}

location = /download/shuguang.ipa {
    return 302 /shuguang.ipa;
}

location = /download {
    alias /opt/shuguang/public/download/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache";
}

location = /download.html {
    return 302 /download;
}

location ^~ /download/ {
    root /opt/shuguang/public;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
