name: iOS Final Acceptance (no publish)
on:
  push:
    branches: [codex/ios-final-acceptance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-final-acceptance
  cancel-in-progress: true
jobs:
  native-acceptance:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Dependencies and source regression
        timeout-minutes: 12
        run: |
          npm install --legacy-peer-deps
          npm run verify:fast
          TARO_PUBLIC_PATH=./ npm run build:h5
          cp -R dist/. www/
          npx cap copy ios
          sudo gem install cocoapods
          (cd ios/App && pod install)
          ruby scripts/setup-ios-ui-tests.rb
      - name: Build app and real UI tests once
        id: build
        timeout-minutes: 18
        run: |
          mkdir -p release/ios-final-acceptance
          xcodebuild -workspace ios/App/App.xcworkspace -scheme NativeDockUITests -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath release/ios-acceptance-derived CODE_SIGNING_ALLOWED=NO build-for-testing > release/ios-final-acceptance/build.log 2>&1 || { tail -150 release/ios-final-acceptance/build.log; exit 1; }
      - name: Create isolated simulator
        id: device
        timeout-minutes: 8
        run: |
          python3 scripts/prepare-ios-acceptance-device.py
          python3 -m venv "$RUNNER_TEMP/dock-image-venv"
          "$RUNNER_TEMP/dock-image-venv/bin/python" -m pip install --quiet Pillow
          "$RUNNER_TEMP/dock-image-venv/bin/python" scripts/test-native-dock-image.py
      - name: Capture all appearance candidates
        id: appearance
        timeout-minutes: 20
        run: |
          export PYTHON="$RUNNER_TEMP/dock-image-venv/bin/python"
          bash scripts/ios-dock-diagnostics.sh release/ios-acceptance-derived/Build/Products/Debug-iphonesimulator/App.app release/ios-final-acceptance/appearance "$(cat release/ios-final-acceptance/device-id.txt)"
      - name: Real native taps and drags
        if: always() && steps.device.outcome == 'success'
        timeout-minutes: 18
        run: |
          bash scripts/run-ios-ui-tests.sh "$(cat release/ios-final-acceptance/device-id.txt)" release/ios-acceptance-derived release/ios-final-acceptance/ui-tests current
      - name: Collect original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-final-acceptance-evidence
          path: release/ios-final-acceptance/
          retention-days: 14
      - name: Clean up owned simulator
        if: always()
        run: |
          if [ -f release/ios-final-acceptance/device-id.txt ]; then
            id="$(cat release/ios-final-acceptance/device-id.txt)"
            xcrun simctl shutdown "$id" || true
            xcrun simctl delete "$id" || true
          fi
