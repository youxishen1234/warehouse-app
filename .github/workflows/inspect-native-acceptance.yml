name: Inspect native acceptance artifact
on:
  push:
    branches: [codex/native-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read existing simulator result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36523525354 --repo "$GITHUB_REPOSITORY" --name native-dock-verification --dir diagnostic
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import json, pathlib, base64, io
          from PIL import Image
          result = json.loads(next(pathlib.Path('diagnostic').rglob('result.json')).read_text())
          for line in [result.get('error', '')] + result.get('trace', [])[-1:]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Native acceptance::' + escaped)
          for source in pathlib.Path('diagnostic').rglob('simulator.png'):
              image = Image.open(source).convert('RGB')
              image = image.crop((0, int(image.height * 0.85), image.width, image.height))
              image.thumbnail((280, 70))
              data = io.BytesIO()
              image.save(data, format='JPEG', quality=35)
              payload = json.dumps({'name':source.stem, 'base64':base64.b64encode(data.getvalue()).decode()})
              assert len(payload) < 3900, len(payload)
              print('::notice title=Native screenshot::' + payload)
          PY
      - name: Inspect failed native stage
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 36523525354 --repo "$GITHUB_REPOSITORY" --log-failed > failure.log
          python3 - <<'PY'
          import pathlib
          content = pathlib.Path('failure.log').read_text()[-3700:]
          escaped = content.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Build failure detail::' + escaped)
          PY
