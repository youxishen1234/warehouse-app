name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          unzip -t android/app/build/outputs/apk/release/app-release.apk >/dev/null
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuguang-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to server
        env:
          SERVER_HOST: ${{ secrets.SHUGUANG_SERVER_HOST || secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SHUGUANG_SERVER_USER || secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SHUGUANG_SERVER_PASSWORD || secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_PASSWORD" ]; then
            echo "::warning::Android server upload secrets are not configured, keeping the Actions artifact only"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no \
            android/app/build/outputs/apk/release/app-release.apk \
            "$SERVER_USER@$SERVER_HOST:/tmp/shuguang.apk"
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "echo '$SERVER_PASSWORD' | sudo -S mv /tmp/shuguang.apk /opt/shuguang/public/shuguang.apk && echo '$SERVER_PASSWORD' | sudo -S chmod 644 /opt/shuguang/public/shuguang.apk"
