name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARO_OUTPUT_DIR: release/android-${{ github.run_id }}-${{ github.run_attempt }}/web
      WAREHOUSE_BUILD_STAGE: release/android-${{ github.run_id }}-${{ github.run_attempt }}/stage
      TARO_PUBLIC_PATH: ./
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate current source
        run: |
          npm run typecheck
          npm run lint
          node --test tests/bluetooth-630k-protocol.test.cjs tests/bluetooth-630k-client.test.cjs tests/bluetooth-print-relay.test.cjs tests/remote-print-agent.test.cjs tests/remote-print-client.test.cjs

      - name: Build complete current web assets
        run: |
          mkdir -p www
          npm run build:h5
          node scripts/release-provenance.cjs "$TARO_OUTPUT_DIR"
          cp -R "$TARO_OUTPUT_DIR"/. www/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/android-gradle.log"
          for attempt in 1 2; do
            echo "Android release build attempt $attempt/2"
            if ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee "$log_file"; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Android Gradle build failed; retrying once"
            fi
          done
          python3 - <<'PY'
          import os
          import pathlib

          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "android-gradle.log"
          lines = log.read_text(errors="replace").splitlines()
          markers = (
              "FAILURE:", "* What went wrong:", "Execution failed for task",
              "Could not determine", "Could not resolve", "Could not find",
              "Could not GET", "Could not HEAD", "UnknownHostException",
              "ConnectException", "PKIX", "No space left", "OutOfMemoryError",
              "DaemonDisappeared", "Daemon disappeared", "Compilation error",
          )
          matches = [index for index, line in enumerate(lines)
                     if any(marker.lower() in line.lower() for marker in markers)]
          if matches:
              indexes = sorted({candidate for index in matches[-8:]
                                for candidate in range(max(0, index - 1), min(len(lines), index + 2))})
              excerpt = [lines[index] for index in indexes][-24:]
          else:
              excerpt = lines[-24:]
          print("::group::Android Gradle failure diagnostics (secret masking active)")
          for line in excerpt:
              safe = " ".join(line.replace("\r", " ").replace("\n", " ").split())[:500]
              print("Gradle> " + safe)
              escaped_line = safe.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Android Gradle diagnostic::" + escaped_line)
          print("::endgroup::")
          summary = next((line.strip() for line in reversed(lines)
                          if any(marker.lower() in line.lower() for marker in markers)),
                         "Gradle build failed twice; inspect the grouped excerpt above.")
          summary = " ".join(summary.split())[:500]
          escaped = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Android Gradle build failed::" + escaped)
          raise SystemExit(1)
          PY

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          unzip -t android/app/build/outputs/apk/release/app-release.apk >/dev/null
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuguang-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK to server
        continue-on-error: true
        env:
          SERVER_HOST: ${{ secrets.SHUGUANG_SERVER_HOST || secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SHUGUANG_SERVER_USER || secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SHUGUANG_SERVER_PASSWORD || secrets.SSH_PASSWORD }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || { [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$SERVER_PASSWORD" ]; }; then
            echo "::warning::Android server upload secrets are not configured, keeping the Actions artifact only"
            exit 0
          fi
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            # SSH key auth (new server, ubuntu@82.156.112.218)
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            scp -o StrictHostKeyChecking=no \
              android/app/build/outputs/apk/release/app-release.apk \
              "$SERVER_USER@$SERVER_HOST:/tmp/shuguang.apk"
            ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
              "mv /tmp/shuguang.apk /opt/shuguang/public/shuguang.apk && cp /opt/shuguang/public/shuguang.apk /opt/shuguang/public/download/shuguang-android.apk && chmod 644 /opt/shuguang/public/shuguang.apk /opt/shuguang/public/download/shuguang-android.apk"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no \
              android/app/build/outputs/apk/release/app-release.apk \
              "$SERVER_USER@$SERVER_HOST:/tmp/shuguang.apk"
            sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
              "echo '$SERVER_PASSWORD' | sudo -S mv /tmp/shuguang.apk /opt/shuguang/public/shuguang.apk && echo '$SERVER_PASSWORD' | sudo -S chmod 644 /opt/shuguang/public/shuguang.apk && echo '$SERVER_PASSWORD' | sudo -S cp /opt/shuguang/public/shuguang.apk /opt/shuguang/public/download/shuguang-android.apk"
          fi
