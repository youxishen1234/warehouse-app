name: Publish hot update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-hotupdate
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai
      TARO_OUTPUT_DIR: dist-${{ github.run_id }}-${{ github.run_attempt }}
      TARO_PUBLIC_PATH: ./
      WAREHOUSE_BUILD_STAGE: release/stage-${{ github.run_id }}-${{ github.run_attempt }}
      HOTUPDATE_HOST: ${{ secrets.SHUGUANG_SERVER_HOST }}
      HOTUPDATE_USER: ${{ secrets.SHUGUANG_SERVER_USER }}
      HOTUPDATE_PASSWORD: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOTUPDATE_BASE_MANIFEST: release/base-manifest.json
      HOTUPDATE_LOCAL_ZIP: release/www.zip
      HOTUPDATE_LOCAL_MANIFEST: release/manifest.json
      BACKEND_LOCAL_BUNDLE: release/backend-bundle-${{ github.run_id }}-${{ github.run_attempt }}.json
      BACKEND_PREFLIGHT_DIR: release/backend-preflight-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure actual source revision
        run: |
          echo "HOTUPDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix backend --omit=dev
          sudo apt-get install -y -qq sshpass
      - name: Capture publication baseline before building
        continue-on-error: true
        run: |
          mkdir -p release
          if [ -z "$HOTUPDATE_HOST" ] || [ -z "$HOTUPDATE_USER" ] || { [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$HOTUPDATE_PASSWORD" ]; }; then
            echo '{}' > "$HOTUPDATE_BASE_MANIFEST"
            echo "::warning::Hot-update server credentials are not configured; build will continue without publishing"
          else
            mkdir -p ~/.ssh
            ssh-keyscan -H "$HOTUPDATE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            if [ -n "$SSH_PRIVATE_KEY" ]; then
              export HOTUPDATE_PASSWORD=''
              echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
            fi
            if ! node scripts/upload-hotupdate.cjs --capture-baseline "$HOTUPDATE_BASE_MANIFEST"; then
              echo '{}' > "$HOTUPDATE_BASE_MANIFEST"
              echo "::warning::Could not read publication baseline; build will continue"
            fi
          fi
      - name: Inspect active web gateway
        if: ${{ env.HOTUPDATE_HOST != '' && env.HOTUPDATE_USER != '' }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then export HOTUPDATE_PASSWORD=''; fi
          node scripts/deploy-nginx-config.cjs --inspect
      - name: Validate source
        env:
          HOTUPDATE_COMMIT: ''
        run: |
          npm run typecheck
          npm run lint
          npx eslint scripts/upload-backend.cjs scripts/verify-backend-billing.cjs
      - name: Build complete current source
        run: |
          rm -rf dist
          mkdir -p www
          npm run build:h5
          npm run test:artifacts
          node scripts/release-provenance.cjs "$TARO_OUTPUT_DIR"
          node scripts/verify-release-features.cjs "$TARO_OUTPUT_DIR"
      - name: Package and verify
        run: |
          python3 scripts/package-hotupdate.py "$TARO_OUTPUT_DIR" "$HOTUPDATE_LOCAL_ZIP" "$HOTUPDATE_LOCAL_MANIFEST"
          node scripts/verify-release-artifacts.cjs --dist "$TARO_OUTPUT_DIR" --zip "$HOTUPDATE_LOCAL_ZIP"
      - name: Install browser workflow tests
        run: npx playwright install --with-deps chromium
      - name: Validate six-view demo and automatic dimensions
        env:
          DEMO_WEB_DIR: dist-${{ github.run_id }}-${{ github.run_attempt }}
        run: node tests/demo-ui-browser.cjs
      - name: Validate K3 serial receipts and agent recovery offline
        run: |
          node --test scripts/k3-serial.test.cjs
          node scripts/k3-serial.cjs self-test
      - name: Run complete backend test suite
        run: node --test backend/*.test.cjs
      - name: Bundle and preflight the exact backend revision
        run: |
          node deploy/backend-release/collect.js > "$BACKEND_LOCAL_BUNDLE"
          node scripts/verify-backend-release.js "$BACKEND_LOCAL_BUNDLE" "$RELEASE_COMMIT"
          node deploy/backend-release/materialize.js "$BACKEND_LOCAL_BUNDLE" "$BACKEND_PREFLIGHT_DIR"
          node deploy/backend-release/preflight.js "$BACKEND_PREFLIGHT_DIR"
          (cd "$BACKEND_PREFLIGHT_DIR" && node "$GITHUB_WORKSPACE/scripts/verify-backend-billing.cjs")
      - name: Publish through shared server lock and stale-source gate
        if: ${{ env.HOTUPDATE_HOST != '' && env.HOTUPDATE_USER != '' }}
        env:
          WAREHOUSE_PUBLISHED_BROWSER_ALLOW_NETWORK_SKIP: '1'
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ] && [ -z "$HOTUPDATE_PASSWORD" ]; then
            echo "::warning::Neither SSH_PRIVATE_KEY nor SHUGUANG_SERVER_PASSWORD configured, skipping publish"
            exit 0
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOTUPDATE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            export HOTUPDATE_PASSWORD=''
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          fi
          node scripts/upload-backend.cjs
          node scripts/upload-hotupdate.cjs
          node tests/published-web-browser.cjs
