name: Publish hot update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build current web assets
        run: npm run build:h5

      - name: Package current web assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          mkdir -p release
          python3 scripts/package-hotupdate.py dist release/www.zip
          # Include seconds so consecutive pushes cannot publish the same bundle id.
          version="$(date -u +%Y%m%d%H%M%S)"
          published="$(date -u '+%Y-%m-%d %H:%M:%S')"
          printf '{"version":"%s","url":"www.zip","publishedAt":"%s"}\n' "$version" "$published" > release/manifest.json
          unzip -t release/www.zip

      - name: Upload web bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SHUGUANG_SERVER_HOST }}
          username: ${{ secrets.SHUGUANG_SERVER_USER }}
          password: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
          port: 22
          source: "release/www.zip"
          target: "/opt/shuguang/public/appupdate"
          strip_components: 1
          overwrite: true

      - name: Upload update manifest
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SHUGUANG_SERVER_HOST }}
          username: ${{ secrets.SHUGUANG_SERVER_USER }}
          password: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
          port: 22
          source: "release/manifest.json"
          target: "/opt/shuguang/public/appupdate"
          strip_components: 1
          overwrite: true
