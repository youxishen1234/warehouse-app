name: Publish hot update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build H5
        run: npm run build:h5

      - name: Prepare update package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          mkdir -p release
          (cd dist && zip -qr ../release/www.zip .)
          VERSION="$(date -u +%Y%m%d%H%M)"
          PUBLISHED_AT="$(date -u '+%Y-%m-%d %H:%M:%S')"
          printf '{"version":"%s","url":"www.zip","publishedAt":"%s"}\n' "$VERSION" "$PUBLISHED_AT" > release/manifest.json
          unzip -t release/www.zip
          ls -la release/

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PASS: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
        shell: bash
        run: |
          echo "SSH_HOST length: ${#SERVER_HOST}"
          echo "SSH_USER length: ${#SSH_USER}"
          echo "SSH_PASS length: ${#SSH_PASS}"
          echo "SSH_HOST: $SERVER_HOST"
          echo "SSH_USER: $SSH_USER"
          if [ -z "$SERVER_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PASS" ]; then
            echo "::error::One or more required secrets are not configured!"
            exit 1
          fi
          echo "All required secrets are configured."
          # Test SSH connection with verbose output
          echo "Testing SSH connection..."
          sshpass -p "$SSH_PASS" ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p 22 "$SSH_USER@$SSH_HOST" "echo 'SSH test successful' && whoami" 2>&1 | tail -30 || echo "SSH test failed with exit code $?"

      - name: Upload update files
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PASS: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
        shell: bash
        run: |
          set -eu
          echo "Connecting to $SSH_USER@$SSH_HOST ..."
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -P 22 release/www.zip release/manifest.json "$SSH_USER@$SSH_HOST:/tmp/"
          echo "Files uploaded to /tmp/"
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p 22 "$SSH_USER@$SSH_HOST" "mkdir -p /opt/shuguang/public/appupdate && mv /tmp/www.zip /opt/shuguang/public/appupdate/www.zip && mv /tmp/manifest.json /opt/shuguang/public/appupdate/manifest.json && echo 'Deploy completed' && ls -la /opt/shuguang/public/appupdate/"
          echo "Hot update published successfully!"
