name: Publish hot update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build H5
        run: npm run build:h5

      - name: Prepare update package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          mkdir -p release
          (cd dist && zip -qr ../release/www.zip .)
          VERSION="$(date -u +%Y%m%d%H%M)"
          PUBLISHED_AT="$(date -u '+%Y-%m-%d %H:%M:%S')"
          printf '{"version":"%s","url":"www.zip","publishedAt":"%s"}\n' "$VERSION" "$PUBLISHED_AT" > release/manifest.json
          unzip -t release/www.zip

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload update files
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -eu
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no -P 22 release/www.zip release/manifest.json "$SSH_USER@$SSH_HOST:/tmp/"
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -p 22 "$SSH_USER@$SSH_HOST" "mkdir -p /opt/shuguang/public/appupdate && mv /tmp/www.zip /opt/shuguang/public/appupdate/www.zip && mv /tmp/manifest.json /opt/shuguang/public/appupdate/manifest.json"
