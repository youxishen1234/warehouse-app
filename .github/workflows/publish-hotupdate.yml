name: Publish hot update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build H5
        run: npm run build:h5

      - name: Prepare update package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          mkdir -p release
          (cd dist && zip -qr ../release/www.zip .)
          VERSION="$(date -u +%Y%m%d%H%M)"
          PUBLISHED_AT="$(date -u '+%Y-%m-%d %H:%M:%S')"
          printf '{"version":"%s","url":"www.zip","publishedAt":"%s"}\n' "$VERSION" "$PUBLISHED_AT" > release/manifest.json
          unzip -t release/www.zip

      - name: Upload update files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "release/www.zip,release/manifest.json"
          target: "/tmp/shuguang-hotupdate"
          overwrite: true

      - name: Publish atomically and clean old files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -eu
            target="/opt/shuguang/public/appupdate"
            mkdir -p "$target"
            mv /tmp/shuguang-hotupdate/release/www.zip "$target/www.zip.new"
            mv /tmp/shuguang-hotupdate/release/manifest.json "$target/manifest.json.new"
            mv "$target/www.zip.new" "$target/www.zip"
            mv "$target/manifest.json.new" "$target/manifest.json"
            rm -rf /tmp/shuguang-hotupdate
            find "$target" -maxdepth 1 -type f \( -name '*.new' -o -name 'www-*.zip' -o -name 'manifest-*.json' \) -delete
