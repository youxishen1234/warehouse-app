name: Publish hot update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package current web assets
        shell: bash
        run: |
          set -euo pipefail
          test -f www/index.html
          mkdir -p release
          (cd www && zip -qr ../release/www.zip .)
          # Include seconds so consecutive pushes cannot publish the same bundle id.
          version="$(date -u +%Y%m%d%H%M%S)"
          published="$(date -u '+%Y-%m-%d %H:%M:%S')"
          printf '{"version":"%s","url":"www.zip","publishedAt":"%s"}\n' "$version" "$published" > release/manifest.json
          unzip -t release/www.zip

      - name: Upload update files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SHUGUANG_SERVER_HOST }}
          username: ${{ secrets.SHUGUANG_SERVER_USER }}
          password: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
          port: 22
          source: "release/www.zip,release/manifest.json"
          target: "/tmp/shuguang-hotupdate"
          overwrite: true

      - name: Publish atomically
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SHUGUANG_SERVER_HOST }}
          username: ${{ secrets.SHUGUANG_SERVER_USER }}
          password: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
          port: 22
          script: |
            set -eu
            # The public update files are served from the deployed app's known
            # document root. Keep this path independent of optional CI secrets.
            target="/opt/shuguang/public/appupdate"
            mkdir -p "$target"
            staging="/tmp/shuguang-hotupdate/release"
            # scp can finish just after the SSH action starts; wait briefly for both files.
            for attempt in 1 2 3 4 5; do
              if [ -f "$staging/www.zip" ] && [ -f "$staging/manifest.json" ]; then
                break
              fi
              sleep 2
            done
            test -f "$staging/www.zip"
            test -f "$staging/manifest.json"
            mv -f "$staging/www.zip" "$target/www.zip.new"
            mv -f "$staging/manifest.json" "$target/manifest.json.new"
            mv "$target/www.zip.new" "$target/www.zip"
            mv "$target/manifest.json.new" "$target/manifest.json"
            rm -rf /tmp/shuguang-hotupdate
