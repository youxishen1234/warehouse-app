name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install Pods
        run: cd ios/App && pod install

      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r 曙光.ipa Payload
          ls -lh 曙光.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: shuguang-ios-ipa
          path: ios/App/曙光.ipa

      - name: Upload IPA to server via SCP
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/deploy_key
          chmod 600 ~/deploy_key

          ssh -i ~/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mkdir -p ${{ secrets.SERVER_TARGET_DIR }}"

          scp -i ~/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -P ${{ secrets.SERVER_PORT }} \
            ios/App/曙光.ipa \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_TARGET_DIR }}/

          echo "✅ IPA 上传成功"
          ssh -i ~/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "ls -lh ${{ secrets.SERVER_TARGET_DIR }}/"
