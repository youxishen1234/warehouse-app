name: Build iOS IPA
permissions: write-all
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select the Liquid Glass SDK
        run: |
          test -d /Applications/Xcode_26.2.app
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
      - name: Install CocoaPods
        run: sudo gem install cocoapods
      - name: Ensure native Liquid Glass simulator runtime
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes -j | python3 -c 'import json,sys; runtimes=json.load(sys.stdin)["runtimes"]; sys.exit(0 if any(r.get("isAvailable") and r.get("name","").startswith("iOS") and int(r.get("version","0").split(".")[0]) >= 26 for r in runtimes) else 1)'; then
            xcodebuild -downloadPlatform iOS
          fi
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps
      - name: Resolve visible iOS version
        run: node scripts/ios-version.cjs >> "$GITHUB_ENV"
      - name: Build current web assets
        run: |
          rm -rf dist
          mkdir -p www
          TARO_PUBLIC_PATH=./ npm run build:h5
          cp -R dist/. www/
      - name: Copy Capacitor assets
        run: npx cap copy ios
      - name: Install Pods
        run: cd ios/App && pod install
      - name: Build simulator and verify native dock
        continue-on-error: true
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath release/ios-simulator CODE_SIGNING_ALLOWED=NO build > release-simulator.log 2>&1 || { tail -150 release-simulator.log; exit 1; }
          bash scripts/ios-simulator-smoke.sh release/ios-simulator/Build/Products/Debug-iphonesimulator/App.app
          python3 -m venv "$RUNNER_TEMP/native-dock-image-venv"
          "$RUNNER_TEMP/native-dock-image-venv/bin/python" -m pip install --quiet Pillow
          "$RUNNER_TEMP/native-dock-image-venv/bin/python" scripts/verify-native-dock-image.py release/ios-smoke
      - name: Upload simulator verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dock-verification
          path: |
            release/ios-smoke/
            release-simulator.log
      - name: Require simulator diagnostics only when IPA build is unavailable
        if: ${{ always() }}
        run: |
          if [ ! -d release/ios-simulator/Build/Products/Debug-iphonesimulator/App.app ]; then
            echo "::warning::Native simulator verification was unavailable; continuing to build the IPA"
          fi
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$IOS_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee ../../release-ipa.log
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r shuguang.ipa Payload
          ls -lh shuguang.ipa
      - name: Upload IPA build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-build-log
          path: release-ipa.log
      - name: Upload IPA artifact
        id: ipa_artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuguang-ios-ipa
          path: ios/App/shuguang.ipa
      - name: Create Release and upload IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3 4; do
              if "$@"; then return 0; fi
              echo "::warning::Release request failed (attempt $attempt/4)"
              sleep $((attempt * 10))
            done
            return 1
          }
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            retry gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "iOS IPA build for $GITHUB_SHA"
          fi
          shopt -s nullglob
          for asset in ios/App/shuguang.ipa release/ios-smoke/result.json release/ios-smoke/simulator.png release/ios-smoke/native-dock-step-*.png release/ios-smoke/dock-preview.jpg; do
            retry gh release upload "$RELEASE_TAG" "$asset" --clobber
          done
      - name: Upload IPA to server
        # A transient GitHub Release failure must not block website delivery.
        if: ${{ !cancelled() && steps.ipa_artifact.outcome == 'success' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          IPA_PATH="ios/App/shuguang.ipa"
          REMOTE_PATH="/opt/shuguang/public/shuguang.ipa"
          node scripts/prepare-download.cjs "$IPA_PATH" release/download
          cp release/download/ipa.json /tmp/shuguang-ipa.json
          cp release/download/source.json /tmp/shuguang-source.json
          cp www/download.html /tmp/shuguang-download.html
          cp scripts/publish-ios-files.sh /tmp/publish-ios-files.sh
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "::warning::SERVER_HOST or SERVER_USER not configured, skipping upload"
            exit 0
          fi
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "Using SSH private key authentication"
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$IPA_PATH" "$SERVER_USER@$SERVER_HOST:/tmp/shuguang.ipa"
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa /tmp/shuguang-ipa.json /tmp/shuguang-source.json /tmp/shuguang-download.html /tmp/publish-ios-files.sh "$SERVER_USER@$SERVER_HOST:/tmp/"
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_HOST" "sudo -n sh /tmp/publish-ios-files.sh"
          elif [ -n "$SSH_PASS" ]; then
            echo "Using password authentication (sshpass)"
            brew install sshpass 2>/dev/null || true
            sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no "$IPA_PATH" "$SERVER_USER@$SERVER_HOST:/tmp/shuguang.ipa"
            sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no /tmp/shuguang-ipa.json /tmp/shuguang-source.json /tmp/shuguang-download.html /tmp/publish-ios-files.sh "$SERVER_USER@$SERVER_HOST:/tmp/"
            printf '%s\n' "$SSH_PASS" | sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "sudo -S sh /tmp/publish-ios-files.sh"
          else
            echo "::warning::Neither SSH_PRIVATE_KEY nor SHUGUANG_SERVER_PASSWORD configured, skipping upload"
            exit 0
          fi
          echo "IPA uploaded successfully to $SERVER_HOST:$REMOTE_PATH"



