name: Build iOS IPA
permissions: write-all
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CocoaPods
        run: sudo gem install cocoapods
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Install Pods
        run: cd ios/App && pod install
      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r shuguang.ipa Payload
          ls -lh shuguang.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuguang-ios-ipa
          path: ios/App/shuguang.ipa
      - name: Create Release and upload IPA
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            iOS IPA 自动构建
            构建编号: ${{ github.run_number }}
            提交: ${{ github.sha }}
          files: ios/App/shuguang.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload IPA to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          IPA_PATH="ios/App/shuguang.ipa"
          REMOTE_PATH="/opt/shuguang/public/shuguang.ipa"
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "::warning::SERVER_HOST or SERVER_USER not configured, skipping upload"
            exit 0
          fi
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "Using SSH private key authentication"
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$IPA_PATH" "$SERVER_USER@$SERVER_HOST:/tmp/shuguang.ipa"
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_HOST" "sudo mv /tmp/shuguang.ipa $REMOTE_PATH && sudo chmod 644 $REMOTE_PATH && ls -la $REMOTE_PATH"
          elif [ -n "$SSH_PASS" ]; then
            echo "Using password authentication (sshpass)"
            brew install sshpass 2>/dev/null || true
            sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no "$IPA_PATH" "$SERVER_USER@$SERVER_HOST:/tmp/shuguang.ipa"
            sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "echo '$SSH_PASS' | sudo -S mv /tmp/shuguang.ipa $REMOTE_PATH && echo '$SSH_PASS' | sudo -S chmod 644 $REMOTE_PATH && ls -la $REMOTE_PATH"
          else
            echo "::warning::Neither SSH_PRIVATE_KEY nor SHUGUANG_SERVER_PASSWORD configured, skipping upload"
            exit 0
          fi
          echo "IPA uploaded successfully to $SERVER_HOST:$REMOTE_PATH"
