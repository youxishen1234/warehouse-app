name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'ios/**'
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build H5
        run: npm run build:h5

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6

      - name: Cap sync iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Build iOS (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build

      - name: Package IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -qr shuguang-ios-unsigned.ipa Payload
          ls -la shuguang-ios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuguang-ios-unsigned
          path: ios/App/build/Build/Products/Release-iphoneos/shuguang-ios-unsigned.ipa
          retention-days: 30

      - name: Upload IPA to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.SHUGUANG_SERVER_PASSWORD }}
        run: |
          set -euo pipefail
          
          IPA_PATH="ios/App/build/Build/Products/Release-iphoneos/shuguang-ios-unsigned.ipa"
          REMOTE_PATH="/opt/shuguang/public/shuguang.ipa"
          
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ]; then
            echo "::warning::SERVER_HOST or SERVER_USER not configured, skipping upload"
            exit 0
          fi
          
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "Using SSH private key authentication"
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
            
            scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$IPA_PATH" "$SERVER_USER@$SERVER_HOST:/tmp/shuguang-ios-unsigned.ipa"
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$SERVER_USER@$SERVER_HOST" "sudo mv /tmp/shuguang-ios-unsigned.ipa $REMOTE_PATH && sudo chmod 644 $REMOTE_PATH && ls -la $REMOTE_PATH"
          elif [ -n "$SSH_PASS" ]; then
            echo "Using password authentication (sshpass)"
            brew install sshpass 2>/dev/null || true
            
            sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no "$IPA_PATH" "$SERVER_USER@$SERVER_HOST:/tmp/shuguang-ios-unsigned.ipa"
            sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "echo '$SSH_PASS' | sudo -S mv /tmp/shuguang-ios-unsigned.ipa $REMOTE_PATH && echo '$SSH_PASS' | sudo -S chmod 644 $REMOTE_PATH && ls -la $REMOTE_PATH"
          else
            echo "::warning::Neither SSH_PRIVATE_KEY nor SHUGUANG_SERVER_PASSWORD configured, skipping upload"
            exit 0
          fi
          
          echo "IPA uploaded successfully to $SERVER_HOST:$REMOTE_PATH"
