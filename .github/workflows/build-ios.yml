name: Build iOS IPAon:  push:    branches: [ main, master ]  workflow_dispatch:jobs:  build:    runs-on: macos-latest    steps:      - name: Checkout        uses: actions/checkout@v4      - name: Install CocoaPods        run: sudo gem install cocoapods      - name: Install npm dependencies        run: npm install --legacy-peer-deps      - name: Sync Capacitor        run: npx cap sync ios      - name: Install Pods        run: cd ios/App && pod install      - name: Build unsigned IPA        run: |          cd ios/App          xcodebuild \            -workspace App.xcworkspace \            -scheme App \            -configuration Release \            -sdk iphoneos \            -derivedDataPath build \
