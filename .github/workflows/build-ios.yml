name: Build iOS IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CocoaPods
        run: sudo gem install cocoapods
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps
      - name: Sync Capacitor
        run: npx cap sync ios
      - name: Install Pods
        run: cd ios/App && pod install
      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r shuguang.ipa Payload
          ls -lh shuguang.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuguang-ios-ipa
          path: ios/App/shuguang.ipa
      - name: Debug SSH
        run: |
          echo "=== 1. Base64长度 ==="
          echo "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | wc -c
          echo "=== 2. Python解码写入私钥 ==="
          python3 -c "import base64, os; open(os.path.expanduser('~/deploy_key'), 'wb').write(base64.b64decode('${{ secrets.SSH_PRIVATE_KEY_B64 }}'))"
          chmod 600 ~/deploy_key
          echo "私钥大小: $(wc -c < ~/deploy_key) bytes"
          echo "=== 3. 私钥前3行 ==="
          head -3 ~/deploy_key
          echo "=== 4. 私钥后3行 ==="
          tail -3 ~/deploy_key
          echo "=== 5. 私钥指纹 ==="
          ssh-keygen -lf ~/deploy_key
          echo "=== 6. 测试私钥有效性 ==="
          ssh-keygen -y -f ~/deploy_key && echo "私钥有效" || echo "私钥无效"
          echo "=== 7. SSH详细连接测试 ==="
          ssh -v -i ~/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo SSH连接成功" 2>&1 | tail -40



























































