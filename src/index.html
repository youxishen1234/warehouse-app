<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no,address=no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="white" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <title>曙光</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'nonce-sg-bootstrap'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://youxishen.online http://localhost:* https://localhost:* http://127.0.0.1:* https://127.0.0.1:*; font-src 'self' data:; connect-src 'self' capacitor://localhost https://youxishen.online http://localhost:* https://localhost:* http://127.0.0.1:* https://127.0.0.1:*; worker-src 'self' blob:;" />
    <script nonce="sg-bootstrap">
      // H5 页面可能被直接打开在任意深层 URL；网页端资源始终从站点根目录解析。
      // Electron/Capacitor 使用 file:// 加载时保留相对路径，避免破坏本地打包资源。
      (function() {
        // Keep direct /pages/... links on the requested page in the hash router.
        var path = window.location.pathname;
        var route = path.match(/^(.*?)(\/pages\/[^/]+)(?:\/index)?\/?$/);
        if (route && !window.location.hash && window.location.protocol !== 'file:') {
          window.history.replaceState(null, '', (route[1] || '') + '/#' + route[2] + '/index' + window.location.search);
        }
        var allowed = {
          '/pages/home/index': true,
          '/pages/customers/index': true,
          '/pages/inventory/index': true,
          '/pages/finance/index': true,
          '/pages/suppliers/index': true,
          '/pages/print-center/index': true
        };
        var normalizeRoute = function() {
          var routePath = window.location.hash.replace(/^#/, '').split('?')[0];
          if (routePath && routePath.indexOf('/pages/') === 0 && !allowed[routePath]) {
            window.history.replaceState(null, '', window.location.pathname + window.location.search + '#/pages/home/index');
          }
        };
        normalizeRoute();
        window.addEventListener('hashchange', normalizeRoute);
        window.addEventListener('popstate', normalizeRoute);
        setTimeout(normalizeRoute, 0);
        setTimeout(normalizeRoute, 100);
        setTimeout(normalizeRoute, 500);
        var nativeApp = Boolean(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (!nativeApp && /^https?:$/.test(window.location.protocol) && /^(localhost|127\.0\.0\.1)$/i.test(window.location.hostname)) nativeApp = true;
        var href = window.location.protocol === 'file:' || nativeApp ? './' : '/';
        // document.write keeps the base element ahead of Webpack's injected
        // script/link tags while the HTML parser is still resolving them.
        document.write('<base href="' + href + '">');
      })();
    </script>
    <script nonce="sg-bootstrap">
      // 按设备宽度自适应 rem：750rpx = 20rem = 视口宽度（所有端等比缩放）
      (function() {
        var set = function() {
          var w = document.documentElement.getBoundingClientRect().width;
          document.documentElement.style.fontSize = (w / 20) + 'px';
        };
        set();
        window.addEventListener('resize', set);
      })();
    </script>
    <script nonce="sg-bootstrap">
      // App 内热更新（仅原生环境生效）：启动时向服务器检查版本，后台静默下载，下次启动生效；全过程上报服务器
      (function() {
        try {
          var cap = window.Capacitor;
          if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
          var TU = cap.Plugins && cap.Plugins.CapacitorUpdater;
          if (!TU) return;
          // 上报启动成功，防止插件误回滚
          TU.notifyAppReady().catch(function() {});

          // 启动时检查更新；下载失败静默处理，不影响当前版本使用。

          // Taro stores { data: address }, while older builds stored plain text.
          // Every release and API uses the canonical domain after server migration.
          var ROOT = 'https://youxishen.online/';
          try {
            var saved = localStorage.getItem('sg_custom_base');
            var wrapped = null;
            try { wrapped = JSON.parse(saved); } catch (e) {}
            var address = wrapped && typeof wrapped === 'object' ? wrapped.data : saved;
            if (address) localStorage.setItem('sg_custom_base', JSON.stringify({ data: ROOT.slice(0, -1) }));
          } catch (e) {}

          var withDeadline = function(work, ms, message) {
            var timer;
            var deadline = new Promise(function(_, reject) {
              timer = setTimeout(function() { reject(new Error(message)); }, ms);
            });
            return Promise.race([Promise.resolve().then(work), deadline]).finally(function() { clearTimeout(timer); });
          };
          var fetchJson = function(url) {
            var controller = new AbortController();
            return withDeadline(async function() {
              var response = await fetch(url, { cache: 'no-store', signal: controller.signal });
              if (!response.ok) throw new Error('HTTP ' + response.status);
              return await response.json();
            }, 6000, '获取更新信息超时').finally(function() { controller.abort(); });
          };
          var API = ROOT + 'api/appupdate/';
          var FILES = ROOT + 'appupdate/';

          // 设备唯一标识（本机持久化，用于服务器统计）
          var did = localStorage.getItem('sg_did');
          if (!did) {
            did = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            localStorage.setItem('sg_did', did);
          }
          var platform = (cap.getPlatform && cap.getPlatform()) || 'native';

          var toast = function(msg) {
            var el = document.createElement('div');
            el.style.cssText = 'position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);max-width:82%;padding:10px 18px;background:rgba(17,24,39,.88);color:#fff;font-size:14px;line-height:1.5;border-radius:10px;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.25);';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 3200);
          };

          // 事件上报（fire-and-forget，失败静默）
          var report = function(ev, extra) {
            try {
              var body = Object.assign({ device_id: did, platform: platform, event: ev }, extra || {});
              fetch(API + 'report?t=' + Date.now(), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
              }).catch(function() {});
            } catch (e) {}
          };

          // Reuse the package URL between attempts so the native plugin can
          // resume any retained partial download. Keep the JS deadline above
          // responseTimeout so its native error reaches the caller first.
          var downloadBundle = async function(url, version, curV, nativeV) {
            for (var attempt = 1; attempt <= 2; attempt++) {
              report('download_attempt', {
                current: curV,
                native_version: nativeV,
                to_version: version,
                message: url + ' (attempt ' + attempt + '/2)'
              });
              try {
                var result = await withDeadline(function() {
                  return TU.download({ url: url, version: version });
                }, 190000, '更新下载超时');
                if (result && result.id) return result;
                throw new Error('empty bundle id');
              } catch (e) {
                report('download_failed', {
                  current: curV,
                  native_version: nativeV,
                  to_version: version,
                  message: ((e && e.message) || 'download error') + ' (attempt ' + attempt + '/2)'
                });
                if (attempt < 2) await new Promise(function(resolve) { setTimeout(resolve, 1500); });
              }
            }
            return null;
          };

          // 简单版本号比较：a<b 返回 -1，a>b 返回 1
          var cmpVer = function(a, b) {
            var pa = String(a).split('.').map(function(x) { return parseInt(x, 10) || 0; });
            var pb = String(b).split('.').map(function(x) { return parseInt(x, 10) || 0; });
            for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
              var d = (pa[i] || 0) - (pb[i] || 0);
              if (d) return d < 0 ? -1 : 1;
            }
            return 0;
          };

          var getNativeVersion = function() {
            var App = cap.Plugins && cap.Plugins.App;
            if (!App || !App.getInfo) return Promise.resolve('');
            return withDeadline(function() { return App.getInfo(); }, 2000, '读取 App 信息超时').then(function(i) { return (i && (i.version || i.build)) || ''; }).catch(function() { return ''; });
          };
          var currentVersion = function() {
            return withDeadline(function() { return TU.current(); }, 8000, '读取当前版本超时').then(function(cur) {
              var cb = cur && cur.bundle;
              return !cb ? 'builtin' : (cb.id === 'builtin' ? 'builtin' : (cb.version || 'builtin'));
            }).catch(function() { return 'builtin'; });
          };

          Promise.resolve().then(async function() {
            var nativeV = await getNativeVersion();
            var curV = await currentVersion();

            // 检测上一次热更新是否已生效：本次启动的 bundle 版本与上次记录不同
            var lastV = localStorage.getItem('sg_bundle_v');
            if (lastV && curV !== 'builtin' && lastV !== curV) {
              report('installed', { from_version: lastV, to_version: curV, current: curV, native_version: nativeV });
            }
            localStorage.setItem('sg_bundle_v', curV);

            // 向服务器检查更新；接口不通时回退静态 manifest.json（兼容旧服务器）
            var m = null;
            try {
              var j = await fetchJson(API + 'check?device_id=' + encodeURIComponent(did) +
                '&platform=' + encodeURIComponent(platform) +
                '&native_version=' + encodeURIComponent(nativeV) +
                '&current=' + encodeURIComponent(curV) + '&t=' + Date.now());
              if (j && j.success && j.data && j.data.version) m = j.data;
            } catch (e) {}
            if (!m) {
              try {
                m = await fetchJson(FILES + 'manifest.json?t=' + Date.now());
              } catch (e) { m = null; }
            }
            if (!m || !m.version || !m.url) return;
            // 服务端明确给出否定更新结果时跳过。
            if (m.update === false) return;
            if (curV === m.version) return;
            // 与后端 isNewerVersion 语义一致：仅当服务端版本确实更新时下载，防止旧包降级。
            var isNewer = false;
            if (/^\d{14}$/.test(String(m.version))) {
              if (curV === 'builtin' || !/^\d{14}$/.test(String(curV))) isNewer = true;
              else isNewer = String(m.version) > String(curV);
            }
            if (!isNewer) return;
            // 热更包要求更高原生版本时跳过（等整包更新）
            if (m.minNativeVersion && nativeV && cmpVer(nativeV, m.minNativeVersion) < 0) return;

            // 已下载过该版本则直接应用，否则下载
            var list = await withDeadline(function() { return TU.list(); }, 8000, '读取已下载版本超时').catch(function() { return { bundles: [] }; });
            var hit = null;
            (list.bundles || []).forEach(function(b) { if (b.version === m.version) hit = b; });
            var bid = hit ? hit.id : null;
            if (!bid) {
              toast('发现新版本，正在自动更新…');
              var res = await downloadBundle(FILES + m.url + '?t=' + Date.now(), m.version, curV, nativeV);
              if (!res) {
                toast('更新下载失败，请检查网络后重试');
                return;
              }
              bid = res.id;
              report('downloaded', { current: curV, native_version: nativeV, to_version: m.version });
            }
            if (!bid) return;
            // 发现新版本后自动下载，重启后生效；iOS 运行中切换网页包会导致 WebView 闪退。
            var nx = await withDeadline(function() { return TU.next({ id: bid }); }, 8000, '安排更新超时').catch(function() { return null; });
            if (nx !== null) {
              report('pending_restart', { current: curV, native_version: nativeV, to_version: m.version });
              toast('更新已下载，请关闭后重新打开 App 生效');
            }
          }).catch(function() {});
        } catch (e) {}
      })();
    </script>
    <script nonce="sg-bootstrap">
      // The shell stylesheet is inserted after the URL base is known;
      // keeping it out of static HTML prevents the browser preload scanner
      // from resolving ./css against a deep route.
      (function() {
        var nativeApp = Boolean(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if (!nativeApp && /^https?:$/.test(window.location.protocol) && /^(localhost|127\.0\.0\.1)$/i.test(window.location.hostname)) nativeApp = true;
        var root = window.location.protocol === 'file:' || nativeApp ? './' : '/';
        document.write('<link rel="stylesheet" href="' + root + 'css/web-shell.css">');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
