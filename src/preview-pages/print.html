<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>打印中心 · 曙光库存</title><link rel="stylesheet" href="preview-shared.css"><style>
.back{width:35px;height:35px;border-radius:10px;background:#eef4ff;color:var(--blue);font-size:24px}.print-types{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:19px}.print-types button{padding:13px 3px;background:white;border:1px solid #e4ecf7;border-radius:13px;font-size:12px;color:#7c8da6}.print-types button.active{color:var(--blue);border-color:#a9c6ff;background:#edf4ff;font-weight:650}.print-types i{font-style:normal;display:block;font-size:23px;margin-bottom:6px}.source{width:100%;padding:12px;background:#f7faff;border:1px solid #e2eaf5;border-radius:10px;color:var(--ink);font:inherit;font-size:12px}.preview-wrap{background:#e9eff7;border-radius:14px;padding:13px;margin-top:14px}.paper{background:white;padding:19px 12px;color:#273b52;box-shadow:0 4px 14px #1735540b;font-size:10px}.watermark{text-align:center;font-size:9px;letter-spacing:2px;color:#a7b3c1;border:1px dashed #d2dbe7;padding:4px;margin-bottom:12px}.paper h2{text-align:center;font-size:20px;letter-spacing:4px;color:#233c5d;margin:0 0 4px}.paper .company{text-align:center;font-size:9px;color:#8d9baf;margin-bottom:15px}.paper-meta{display:flex;justify-content:space-between;gap:10px;margin:7px 0;font-size:9px}.paper table{width:100%;border-collapse:collapse;margin:13px 0;font-size:9px;table-layout:fixed}.paper th,.paper td{border:1px solid #cad5e3;padding:8px 4px;overflow-wrap:anywhere;text-align:center;font-weight:400}.paper th{background:#f2f5fa;color:#60758f}.paper .total{display:flex;justify-content:space-between;background:#f4f7fb;padding:10px;font-weight:650}.signatures{display:flex;justify-content:space-between;margin-top:25px;color:#8593a6;font-size:9px}.settings{display:flex;gap:12px;align-items:center;font-size:11px;color:#7c8fa8;margin-top:13px;flex-wrap:wrap}.settings select{padding:7px;border:1px solid #e0e8f4;border-radius:7px;background:white;color:#647d9d}.settings label{display:flex;align-items:center;gap:5px}.note{font-size:10px;color:#8d9db3;line-height:1.8}.recent{padding:12px 0;border-bottom:1px solid #edf1f7;font-size:11px;display:flex;justify-content:space-between;color:#6d829e}.fixed-print{position:fixed;bottom:28px;width:430px;max-width:100%;background:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #e6edf6;border-radius:0 0 30px 30px;display:flex;gap:9px}.fixed-print button{margin:0;font-size:13px}.fixed-print .secondary{background:#eff4ff;color:var(--blue);box-shadow:none;width:35%}.fixed-print .primary{flex:1}.status-banner{padding:12px;background:#eef5ff;color:#6c86ab;border-radius:11px;font-size:11px;line-height:1.8;margin-bottom:17px}.paper-tools{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#8b9cb4;margin-top:17px}.paper-tools button{background:none;color:var(--blue);font-size:11px}.hide-price .money-cell{display:none}.expanded{position:fixed;inset:0;z-index:10;background:#e8edf5;overflow:auto;padding:22px 14px 90px}.expanded .paper{max-width:700px;margin:auto;font-size:14px;padding:30px 20px}.expanded table{font-size:12px}.expanded .paper-meta{font-size:12px}.close-expanded{display:none}.expanded .close-expanded{display:block;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2469ee;color:white;border-radius:12px;padding:12px 28px;z-index:12}@media(max-width:500px){.fixed-print{bottom:0;width:100%;border-radius:0}}@page{size:A4;margin:12mm}@media print{body{background:white}.preview-label,.header,.print-types,.status-banner,.card,.list-head,.fixed-print,.demo,.paper-tools,.close-expanded{display:none!important}.phone{margin:0;max-width:none;border:0;box-shadow:none;border-radius:0;min-height:0}.content{padding:0}.preview-wrap,.preview-wrap.expanded{position:static;padding:0;background:white;border-radius:0;overflow:visible}.paper{box-shadow:none;font-size:12px;padding:0}.paper table{font-size:12px}.paper-meta{font-size:12px}.paper h2{font-size:26px}.signatures{font-size:12px}.watermark{color:#777}}
</style></head><body><div class="preview-label">打印中心 · 手机交互方案预览</div><div class="phone"><header class="header"><div class="top"><button class="back" onclick="location.href='index.html'" aria-label="返回总台">‹</button><div><div class="brand">曙 光 库 存</div><h1>打印中心</h1></div><span class="badge" style="margin-left:auto">预览版</span></div><div class="meta"><span>已有业务直接带出，不用再填一遍</span></div></header><main class="content"><div class="status-banner">打印服务尚未连接<br>当前可查看样张，或打开系统打印／另存 PDF。</div><div class="print-types" role="tablist"><button id="type-delivery" onclick="setType('delivery')" role="tab"><i>▤</i>送货单</button><button id="type-label" onclick="setType('label')" role="tab"><i>▣</i>标签打印</button><button id="type-statement" onclick="setType('statement')" role="tab"><i>¥</i>对账单</button></div><div class="card"><div class="section-head"><h2 id="source-title">选择出库单</h2><span class="hint">原单资料自动带出</span></div><select id="source" class="source" aria-label="选择打印来源" onchange="renderPaper()"></select><div class="settings"><label>份数 <select id="copies"><option>1</option><option>2</option><option>3</option></select></label><label><input id="show-price" type="checkbox" checked onchange="renderPaper()">显示金额</label><span id="paper-size">241 × 93 mm 连续纸</span></div><p id="source-note" class="note"></p></div><div class="paper-tools"><span>单据预览 · 可展开检查内容</span><button onclick="document.getElementById('preview').classList.add('expanded')">放大预览 ↗</button></div><div class="preview-wrap" id="preview"><article class="paper" id="paper"></article><button class="close-expanded" onclick="document.getElementById('preview').classList.remove('expanded')">返回打印中心</button></div><div class="list-head"><h2>最近打开打印</h2><span class="hint">不代表打印成功</span></div><div class="card" id="history"><p class="note">尚未打开系统打印。</p></div><div class="demo">示例单据均有样张标记，不会创建出库或改变账款</div></main><div class="fixed-print"><button class="primary secondary" onclick="document.getElementById('preview').classList.add('expanded')">查看大图</button><button class="primary" onclick="printDocument()">系统打印 / PDF</button></div></div><script src="preview-store.js"></script><script src="dimension-input.js"></script><script src="project-print-template.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});let type='delivery',db=PreviewStore.read(),sources=[],history=[],pendingPrint=null;const stamp=()=>new Date().toLocaleString('zh-CN',{hour12:false});
function setType(t){type=t;db=PreviewStore.read();for(let k of ['delivery','label','statement']){$('type-'+k).classList.toggle('active',k===t);$('type-'+k).setAttribute('aria-selected',String(k===t))}if(type==='delivery'){sources=[{id:'sample-delivery',title:'样张 · 味中皇 · SH-20261027-00050',party:'味中皇',address:'',date:'2026-10-27',lines:[{goods:'6桶',spec:'',qty:45,unit:'个',price:2.3,total:103.5},{goods:'6坛臭',spec:'',qty:400,unit:'个',price:1.25,total:500}],note:'出库单样张，未实际发货。正式接入后仅从已确认出库单带入。'}];$('source-title').textContent='选择出库单';$('source-note').textContent='这里展示送货单样张；预览订单尚未生成真实出库单，不冒充已出库数据。'}else if(type==='inbound'){sources=db.stock.filter(s=>s.enteredAt).map(s=>({id:'stock-'+s.id,title:s.name+' · '+s.enteredAt,party:s.supplier||'自产 / 未关联供货商',customer:s.customerName||db.customers.find(c=>c.id===s.customerId)?.name||'公共备货',date:s.enteredAt,lines:[{goods:s.name,spec:s.size,qty:s.qty,unit:s.unit,price:null,total:s.totalAmount}],note:'当前库存批次快照；经过补入或盘点后，数量不等于首次入库数量。正式入库单需按对应入库流水打印。'}));if(!sources.length)sources=[{id:'sample-inbound',title:'样张 · 华盛纸业 · 纸板入库',party:'华盛纸业',customer:'鸿达商贸',date:'2026-10-28 10:20',lines:[{goods:'五层 BC 楞纸板',spec:'120 × 80 cm',qty:1000,unit:'张',price:null,total:6528}],note:'入库单示例：每张 0.96 ㎡，平方米单价 6.80 元，合计 960 ㎡。'}];$('source-title').textContent='选择入库批次';$('source-note').textContent='新登记批次会自动出现。入库成本与销售金额分开显示；未知金额标记待核算。'}else{sources=db.customers.map(c=>({id:'client-'+c.id,title:c.name+' · 当前往来余额',party:c.name,date:stamp(),balance:c.balance,lines:[],note:'余额核对样张：当前预览没有完整期间应收明细，因此不生成虚构的月度对账明细。'}));$('source-title').textContent='选择对账客户';$('source-note').textContent='展示当前待收余额及本预览保存的收款记录。正式版按日期范围汇总完整出库、退货与收款。'}$('source').innerHTML=sources.map((s,i)=>`<option value="${i}">${esc(s.title)}</option>`).join('');renderPaper()}
function renderPaper(){if(type==='delivery'){renderProjectDelivery();return}$('paper-size').textContent='A4 样张';let s=sources[Number($('source').value)||0],price=$('show-price').checked,statement=type==='statement',title=type==='delivery'?'送货单':type==='inbound'?'入库批次快照':'客户余额核对单';if(!s)return;let html=`<div class="watermark">预览样张 · 非正式凭证</div><h2>${title}</h2><div class="company">曙光库存 · 业务单据</div><div class="paper-meta"><span>${type==='inbound'?'供货来源':'客户'}：${esc(s.party)}</span><span>${esc(s.date)}</span></div>`;if(s.customer)html+=`<div class="paper-meta"><span>关联客户：${esc(s.customer)}</span></div>`;if(s.address)html+=`<div class="paper-meta"><span>送货地址：${esc(s.address)}</span></div>`;if(statement){let id=Number(s.id.replace('client-','')),records=db.records.filter(r=>r.type==='receive'&&r.partyId===id);html+=`<div class="total"><span>当前待收余额</span><span>${price?'¥'+money(s.balance):'金额已隐藏'}</span></div><table><thead><tr><th>日期</th><th>事项</th>${price?'<th>收款金额</th>':''}</tr></thead><tbody>`+(records.length?records.map(r=>`<tr><td>${esc(r.time)}</td><td>${esc(r.label)}</td>${price?'<td>¥'+money(r.amount)+'</td>':''}</tr>`).join(''):`<tr><td colspan="${price?3:2}">暂无本预览收款记录</td></tr>`)+`</tbody></table>`}else{html+='<table><thead><tr><th style="width:15%">货物</th><th style="width:28%">规格</th><th>数量</th>'+ (price?'<th>金额</th>':'')+'</tr></thead><tbody>'+s.lines.map(l=>`<tr><td>${esc(l.goods)}</td><td>${esc(l.spec)}</td><td>${l.qty} ${esc(l.unit)}</td>${price?'<td>'+(l.total==null?'待核算':money(l.total))+'</td>':''}</tr>`).join('')+'</tbody></table>';if(price)html+=`<div class="total"><span>${type==='inbound'?'入库成本金额':'销售金额'}合计</span><span>${s.lines.some(l=>l.total==null)?'待核算':'¥'+money(s.lines.reduce((a,l)=>a+l.total,0))}</span></div>`}html+=`<p style="color:#8c9caf;font-size:9px;line-height:1.8;margin-top:15px">${esc(s.note)}</p><div class="signatures"><span>制单：________</span><span>${type==='inbound'?'收货':'客户'}签字：________</span></div>`;$('paper').innerHTML=html}
function printDocument(){if(type==='delivery'){const f=$('project-frame');if(!f||!f.contentWindow||!f.dataset.ready)return;f.contentWindow.focus();f.contentWindow.print();history.unshift({title:sources[Number($('source').value)||0].title,time:stamp()});$('history').innerHTML=history.slice(0,5).map(h=>`<div class="recent"><span>${esc(h.title)}<br><small>已打开系统打印，结果请核对；份数在系统窗口设置</small></span><span>${esc(h.time)}</span></div>`).join('');return}pendingPrint={title:sources[Number($('source').value)||0].title,time:stamp()};let copies=Number($('copies').value);document.getElementById('preview').classList.remove('expanded');let original=$('paper').innerHTML;if(copies>1)$('paper').innerHTML=Array.from({length:copies},(_,i)=>`<div style="${i?'break-before:page;page-break-before:always':''}">${original}</div>`).join('');window.print();$('paper').innerHTML=original;if(pendingPrint){history.unshift(pendingPrint);pendingPrint=null;$('history').innerHTML=history.slice(0,5).map(h=>`<div class="recent"><span>${esc(h.title)}<br><small>已打开系统打印，结果请核对</small></span><span>${esc(h.time)}</span></div>`).join('')}}function renderProjectDelivery(){let s=sources[Number($('source').value)||0];$('paper-size').textContent='241 × 93 mm 连续纸';$('source-note').textContent='使用项目打印 App 的原模板：8 列、5 行、人民币大写合计及收货／送货签字。示例数据，未实际出库。打印份数请在系统窗口设置。';let settings=ProjectPrint.normalizePrintSettings({...ProjectPrint.DEFAULT_PRINT_SETTINGS,template:'delivery-note',company:s.company||'东光县曙光纸箱包装',paper:'241-93',showPrices:$('show-price').checked});let doc={key:'preview',number:'SH-20261027-00050',title:'送 货 单',party:s.party,address:s.address||'',date:s.date.slice(0,10),operator:s.sender||'',receiver:s.receiver||'',orderNumber:'',lines:s.lines.map((l,i)=>({id:i+1,product_id:i+1,type:'out',created_at:0,operator:'',product_name:l.goods,specification:l.spec,quantity:l.qty,unit:l.unit,unit_price:l.price,amount:l.total,remark:l.remark||''}))};window.currentPrintDoc=doc;window.currentPrintSettings=settings;let paper=$('paper');paper.style.padding='0';paper.innerHTML='<div class="watermark" style="margin:0 0 8px">预览样张 · 模板来自项目打印 App</div><div id="frame-stage" style="position:relative;overflow:hidden"><iframe id="project-frame" title="项目原格式送货单" style="border:0;display:block;transform-origin:top left"></iframe></div>';let f=$('project-frame'),naturalWidth=settings.width*96/25.4+24;f.style.width=naturalWidth+'px';f.style.height='390px';f.onload=()=>{try{ProjectPrint.paginateDotMatrixDocument(f.contentDocument,doc,settings);f.dataset.ready='1';fitFrame()}catch(e){$('source-note').textContent='模板预览失败：'+e.message}};f.srcdoc=ProjectPrint.buildDotMatrixHtml(doc,settings)}
function fitFrame(){let f=$('project-frame'),stage=$('frame-stage');if(!f||!stage||!window.currentPrintSettings||!f.contentDocument?.body)return;let width=currentPrintSettings.width*96/25.4+24,height=f.contentDocument.body.scrollHeight+12,scale=Math.min(1,stage.clientWidth/width);f.style.height=height+'px';f.style.transform='scale('+scale+')';stage.style.height=height*scale+'px'}new ResizeObserver(()=>{if(type==='delivery')fitFrame()}).observe($('preview'));
window.addEventListener('storage',()=>setType(type));
</script><script src="print-enhancements.js"></script></body></html>
