<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>客户管理 · 曙光库存</title><link rel="stylesheet" href="preview-shared.css"><style>
.search{display:flex;align-items:center;gap:9px;padding:12px 14px;border:1px solid #e5ecf6;background:white;border-radius:12px;margin:16px 0 12px;color:#99a8bc}.search input{border:0;outline:0;background:none;width:100%;font:inherit;font-size:13px;color:var(--ink)}.filters{display:flex;gap:8px;margin-bottom:16px}.filters button{background:#eaf0f8;color:#8090a7;border-radius:8px;padding:8px 12px;font-size:11px}.filters button.active{background:#e6eeff;color:var(--blue);font-weight:600}.customer-card{width:100%;background:white;text-align:left;border:1px solid #e9eff6;border-radius:16px;padding:16px;margin-bottom:11px}.customer-card .avatar{width:40px;height:40px;font-size:15px}.customer-meta{font-size:10px;color:#91a0b4;margin-top:4px}.customer-balance{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eff3f8;padding-top:12px;margin-top:13px;font-size:11px;color:#8c9ab0}.customer-balance strong{color:#c58a32;font-size:15px;font-weight:600}.customer-balance .clear{color:#4d9b82;font-size:12px}.summary-strip{display:grid;grid-template-columns:repeat(3,1fr);background:white;border-radius:16px;padding:17px 8px;border:1px solid #e9eff6}.summary-strip div{text-align:center;border-right:1px solid #edf1f7}.summary-strip div:last-child{border:0}.summary-strip small{display:block;font-size:10px;color:#91a0b4;margin-bottom:5px}.summary-strip strong{font-size:19px}.header-back{background:#f0f5ff;color:var(--blue);border-radius:11px;width:36px;height:36px;font-size:24px}.detail-hero{background:linear-gradient(130deg,#2469ee,#5790f9);padding:23px 18px;color:white;border-radius:18px;margin-bottom:16px}.detail-hero h2{font-size:22px}.detail-hero p{font-size:11px;opacity:.8;margin:6px 0 20px}.detail-hero small{font-size:11px;opacity:.8;display:block}.detail-hero strong{display:block;font-size:28px;margin-top:4px}.detail-tabs{display:flex;border-bottom:1px solid #e5edf7;gap:24px;margin-bottom:18px}.detail-tabs button{background:none;font-size:13px;padding:10px 0;color:#8c9db3;border-bottom:2px solid transparent}.detail-tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}.spec{padding:15px;background:white;border:1px solid #e7eef7;border-radius:14px;margin-bottom:11px}.spec h3{font-size:14px;margin:0 0 5px}.spec p{font-size:11px;color:#8c9cb3;margin:0 0 13px}.spec-foot{display:flex;justify-content:space-between;align-items:center}.spec-foot strong{color:#587392;font-size:13px}.empty-state{text-align:center;padding:35px 12px;color:#8b9bb0;font-size:12px}.fixed-action{position:fixed;bottom:28px;max-width:430px;width:100%;background:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #e8edf5;border-radius:0 0 30px 30px;display:flex;gap:10px}.fixed-action button{margin:0;min-height:46px}.fixed-action .outline{background:#eef4ff;color:var(--blue);box-shadow:none;width:38%;font-size:13px}.fixed-action .primary{flex:1;font-size:13px}.section-head .action{border:0;padding:6px 10px}.sheet textarea{width:100%;min-height:72px;border:1px solid #e2e9f2;border-radius:10px;padding:12px;font:inherit;color:var(--ink);background:#f9fbfe}@media(max-width:500px){.fixed-action{bottom:0;max-width:none;border-radius:0}}
</style></head><body><div class="preview-label">手机客户管理 · 交互方案预览</div><div class="phone"><header class="header"><div class="top"><button class="header-back" id="back" aria-label="返回" onclick="goBack()">‹</button><div><div class="brand">曙 光 库 存</div><h1 id="title">客户管理</h1></div><button class="action" style="margin-left:auto" id="header-action" onclick="editCustomer()">＋ 新增</button></div><div class="meta"><span id="subheading">常用资料存一次，开单直接带出</span><span class="synced">● 演示数据</span></div></header><main class="content" id="content"></main><div class="fixed-action" id="bottom"><button class="primary" onclick="editCustomer()">＋ 新增客户</button></div></div><div id="modal" class="backdrop hidden" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title"></h2><button class="close" aria-label="关闭" onclick="closeSheet()">×</button></div><div id="sheet-body"></div></section></div><div id="toast" class="toast hidden" role="status"></div>
<script src="preview-store.js"></script><script src="dimension-input.js"></script><script>
const $=id=>document.getElementById(id),money=n=>'¥'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let clients=PreviewStore.read().customers;
let selected=null,filter='all',query='',detailTab='goods',toastTimer,restoreFocus;let receipts=[],demoOrders=[];
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function sheet(t,b){restoreFocus=document.activeElement;$('sheet-title').textContent=t;$('sheet-body').innerHTML=b;$('modal').classList.remove('hidden');document.body.style.overflow='hidden';document.querySelector('.close').focus()}
function closeSheet(){$('modal').classList.add('hidden');document.body.style.overflow='';restoreFocus?.focus()}
document.addEventListener('keydown',e=>{if($('modal').classList.contains('hidden'))return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){let a=[...$('modal').querySelectorAll('button,input,select,textarea')],first=a[0],last=a[a.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function goBack(){if(selected){selected=null;render()}else location.href='index.html'}
function persistCustomers(){let db=PreviewStore.read();db.customers=clients;PreviewStore.write(db)}
function render(){persistCustomers();if(selected){renderDetail();return}$('title').textContent='客户管理';$('subheading').textContent='常用资料存一次，开单直接带出';$('header-action').textContent='＋ 新增';$('header-action').onclick=()=>editCustomer();$('bottom').innerHTML='<button class="primary" onclick="editCustomer()">＋ 新增客户</button>';$('content').innerHTML=`<div class="summary-strip"><div><small>全部客户</small><strong>${clients.length}</strong></div><div><small>待收款客户</small><strong>${clients.filter(c=>c.balance>0).length}</strong></div><div><small>待收合计</small><strong style="font-size:17px;color:#b6853c">${money(clients.reduce((s,c)=>s+c.balance,0))}</strong></div></div><div class="search"><span>⌕</span><input id="search" aria-label="搜索客户" placeholder="搜索客户、联系人或手机号" value="${escapeHtml(query)}" oninput="query=this.value;renderList()"></div><div class="filters"><button id="filter-all" onclick="setFilter('all')">全部客户</button><button id="filter-pinned" onclick="setFilter('pinned')">常用客户</button><button id="filter-debt" onclick="setFilter('debt')">有待收款</button></div><div id="client-list"></div><div class="demo">演示数据 · 与收付款页面共用浏览器本地资料</div>`;renderList()}
function setFilter(f){filter=f;renderList()}
function renderList(){for(let k of ['all','pinned','debt'])$('filter-'+k).classList.toggle('active',filter===k);let list=clients.filter(c=>(filter!=='pinned'||c.pinned)&&(filter!=='debt'||c.balance>0)&&[c.name,c.person,c.phone].some(s=>s.includes(query.trim()))).sort((a,b)=>Number(b.pinned)-Number(a.pinned));$('client-list').innerHTML=list.map(c=>`<button class="customer-card" onclick="openClient(${c.id})"><div class="order-top"><span class="avatar">${escapeHtml(c.name[0])}</span><div><div class="customer">${escapeHtml(c.name)} ${c.pinned?'<span style="font-size:10px;color:#d4a153">★</span>':''}</div><div class="customer-meta">${escapeHtml(c.person)} · ${escapeHtml(c.phone)}</div></div><span style="margin-left:auto;color:#a4b2c5">›</span></div><div class="customer-balance"><span>常用货物 ${c.specs.length} 种</span>${c.balance?'<span>待收 <strong>'+money(c.balance)+'</strong></span>':'<span class="clear">账款已结清</span>'}</div></button>`).join('')||'<div class="empty-state">没有找到匹配的客户，换个关键词试试。</div>'}
function openClient(id){selected=clients.find(c=>c.id===id);detailTab='goods';renderDetail();window.scrollTo(0,0)}
function renderDetail(){persistCustomers();let c=selected;$('title').textContent='客户详情';$('subheading').textContent='客户资料与业务记录集中查看';$('header-action').textContent='编辑资料';$('header-action').onclick=()=>editCustomer(c.id);$('bottom').innerHTML=`<button class="primary outline" onclick="collect()">登记收款</button><button class="primary" onclick="order()">＋ 给客户开单</button>`;$('content').innerHTML=`<div class="detail-hero"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${escapeHtml(c.name)}</h2><button style="background:#ffffff22;color:white;border-radius:7px;padding:5px 9px;font-size:11px" onclick="selected.pinned=!selected.pinned;renderDetail()">${c.pinned?'★ 已设常用':'☆ 设为常用'}</button></div><p>${escapeHtml(c.person)} · ${escapeHtml(c.phone)}</p><small>当前待收款</small><strong>${money(c.balance)}</strong></div><div class="detail-tabs"><button id="dt-goods" onclick="detailTab='goods';renderDetail()">常用货物</button><button id="dt-bills" onclick="detailTab='bills';renderDetail()">往来账单</button><button id="dt-info" onclick="detailTab='info';renderDetail()">客户资料</button></div><div id="detail-body"></div><div class="demo">预览操作不写入正式系统</div>`;$('dt-'+detailTab).classList.add('active');let body=$('detail-body');if(detailTab==='goods')body.innerHTML=`<div class="section-head"><h2>常用规格 <span class="hint">${c.specs.length} 种</span></h2><button class="action" onclick="editSpec()">＋ 添加货物</button></div>`+c.specs.map((s,i)=>`<div class="spec"><div style="display:flex;justify-content:space-between"><h3>${escapeHtml(s.name)}</h3><button class="link" style="padding:0" onclick="editSpec(${i})">编辑</button></div><p>${escapeHtml(s.size)} · ${escapeHtml(s.material)}</p><div class="spec-foot"><div><strong>${money(s.price)} / 个</strong><span class="hint" style="display:block;margin-top:4px">演示可用库存 ${s.stock} 个</span></div><button class="action" onclick="order(${i})">用此货物开单</button></div></div>`).join('')+(c.specs.length?'':'<div class="empty-state">先添加常用货物，下次开单直接带出。</div>');else if(detailTab==='bills'){let os=demoOrders.filter(o=>o.client===c.id),rs=receipts.filter(r=>r.client===c.id);body.innerHTML=`<div class="card"><div class="section-head"><h2>未结往来款</h2><span class="badge ${c.balance?'warn':''}">${c.balance?'待收款':'已结清'}</span></div><div class="detail-row"><span>示例历史未结余额</span>${money(c.balance)}</div><p class="hint">新建订单不直接增加应收，确认出库后再记账。</p></div>`+os.map(o=>`<div class="spec"><h3>新建客户订单 · ${escapeHtml(o.name)}</h3><p>${o.qty} 个 · ${money(o.total)} · ${escapeHtml(o.date)}</p><span class="badge">${o.qty<=o.stock?'库存够，待确认出库':'库存不足，需安排生产'}</span></div>`).join('')+rs.map(r=>`<div class="spec"><h3>收款记录</h3><div class="detail-row"><span>刚刚 · ${escapeHtml(r.note||'客户收款')}</span>${money(r.amount)}</div></div>`).join('')}else body.innerHTML=`<div class="card"><div class="detail-row"><span>客户名称</span>${escapeHtml(c.name)}</div><div class="detail-row"><span>联系人</span>${escapeHtml(c.person)}</div><div class="detail-row"><span>手机号码</span>${escapeHtml(c.phone)}</div><div class="detail-row"><span>送货地址</span><b style="max-width:65%;font-weight:400;text-align:right">${escapeHtml(c.address||'未填写')}</b></div><div style="padding-top:15px"><span class="hint">业务备注</span><p style="font-size:12px;white-space:pre-wrap">${escapeHtml(c.note||'暂无备注')}</p></div></div>`}
function field(label,id,value='',type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${escapeHtml(value)}"></div>`}
function editCustomer(id){let c=clients.find(x=>x.id===id)||{};sheet(id?'编辑客户资料':'新增客户','<p>客户资料保存后，开单、送货和收款时直接复用。</p>'+field('客户名称（必填）','c-name',c.name)+field('联系人','c-person',c.person)+field('手机号码','c-phone',c.phone,'tel')+field('送货地址','c-address',c.address)+`<div class="field"><label for="c-note">业务备注</label><textarea id="c-note">${escapeHtml(c.note||'')}</textarea></div><button class="primary" onclick="saveCustomer(${id||0})">保存客户资料</button>`)}
function saveCustomer(id){let name=$('c-name').value.trim();if(!name){toast('请填写客户名称');return}if(clients.some(c=>c.id!==id&&c.name===name)){toast('该客户名称已存在');return}let values={name,person:$('c-person').value.trim(),phone:$('c-phone').value.trim(),address:$('c-address').value.trim(),note:$('c-note').value.trim()};if(id)Object.assign(clients.find(c=>c.id===id),values);else clients.push({...values,id:Math.max(0,...clients.map(c=>c.id))+1,balance:0,pinned:false,specs:[]});closeSheet();render();toast('客户资料已在本次预览中保存')}
function editSpec(index){let s=selected.specs[index]||{};sheet(index===undefined?'添加常用货物':'编辑常用货物','<p>保存货名、规格和参考单价，下次直接选择。历史单据保留原价格。</p>'+field('货物名称（必填）','s-name',s.name)+field('尺寸 / 规格（必填）','s-size',s.size)+field('材质 / 楞型','s-material',s.material)+field('参考单价（元 / 个）','s-price',s.price??'','number')+`<button class="primary" onclick="saveSpec(${index===undefined?-1:index})">保存常用货物</button>`)}
function saveSpec(index){let name=$('s-name').value.trim(),size=$('s-size').value.trim(),price=Number($('s-price').value);if(!name||!size||!$('s-price').value||!Number.isFinite(price)||price<0){toast('请填写货名、规格及有效单价');return}let s={name,size,material:$('s-material').value.trim(),price,stock:index<0?0:selected.specs[index].stock};if(index<0)selected.specs.push(s);else selected.specs[index]=s;closeSheet();detailTab='goods';renderDetail();toast('常用货物已保存，下次开单直接带出')}
function order(index=0){if(!selected.specs.length){toast('请先添加客户常用货物');editSpec();return}sheet('给'+selected.name+'开单','<p>客户、规格、价格和地址已带入，只修改本次数量与交期。</p><div class="field"><label>常用货物</label><select id="o-spec">'+selected.specs.map((s,i)=>`<option value="${i}">${escapeHtml(s.name+' · '+s.size)}</option>`).join('')+'</select></div>'+field('数量（个）','o-qty',200,'number')+field('本次单价（元）','o-price',selected.specs[index].price,'number')+field('交货日期','o-date','2026-10-29','date')+`<div class="flow-note">送货地址：${escapeHtml(selected.address||'未填写，可在客户资料中补充')}</div><button class="primary" onclick="saveOrder()">保存订单 · 检查库存</button>`);$('o-spec').value=index;$('o-spec').onchange=()=>{$('o-price').value=selected.specs[Number($('o-spec').value)].price}}
function saveOrder(){let qty=Number($('o-qty').value),price=Number($('o-price').value),date=$('o-date').value,s=selected.specs[Number($('o-spec').value)];if(!Number.isInteger(qty)||qty<=0||!$('o-price').value||!Number.isFinite(price)||price<0||!date){toast('请核对数量、单价和交期');return}demoOrders.push({client:selected.id,name:s.name,qty,total:Math.round(qty*price*100)/100,date,stock:s.stock});closeSheet();detailTab='bills';renderDetail();toast(qty<=s.stock?'订单已模拟保存，库存充足，可继续出库':'订单已模拟保存，缺货 '+(qty-s.stock)+' 个，需安排生产')}
function collect(){if(!selected.balance){toast('该客户暂无待收款');return}sheet('登记收款','<p>'+escapeHtml(selected.name)+' · 当前待收 '+money(selected.balance)+'</p>'+field('实际到账金额（元）','r-amount',selected.balance,'number')+field('收款备注','r-note','')+'<button class="primary" onclick="saveReceipt()">确认收款 · 更新余额</button>')}
function saveReceipt(){let amount=Number($('r-amount').value);if(!Number.isFinite(amount)||amount<=0||amount>selected.balance||Math.abs(amount*100-Math.round(amount*100))>0.000001){toast('金额需大于零、不超过待收款，最多两位小数');return}receipts.unshift({client:selected.id,amount,note:$('r-note').value.trim()});let shared=PreviewStore.read();shared.records.unshift({id:Date.now(),type:'receive',partyId:selected.id,party:selected.name,amount,label:'客户收款',note:$('r-note').value.trim(),time:'刚刚'});PreviewStore.write(shared);selected.balance=Math.round((selected.balance-amount)*100)/100;closeSheet();detailTab='bills';renderDetail();toast('已模拟登记收款，客户余额同步更新')}
window.addEventListener('storage',e=>{if(e.key===PreviewStore.key){let id=selected?.id;clients=PreviewStore.read().customers;selected=clients.find(c=>c.id===id)||null;render()}});
render();
</script></body></html>
