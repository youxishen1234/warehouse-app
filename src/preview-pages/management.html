<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>业务管理 · 曙光库存</title><link rel="stylesheet" href="preview-shared.css"><style>
.search{width:100%;background:white;border:1px solid #e2eaf5;border-radius:12px;padding:13px 15px;margin:16px 0;font:inherit;font-size:13px;color:var(--ink)}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.pills button{padding:8px 13px;background:#e9eff8;border-radius:9px;color:#8492a8;font-size:11px}.pills .active{background:#e1ecff;color:var(--blue);font-weight:650}.row-card{width:100%;text-align:left;display:block;border:1px solid #e7edf6;border-radius:15px;background:white;padding:16px;margin-bottom:11px}.row-top{display:flex;align-items:center;gap:10px}.row-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:12px;border-top:1px solid #edf2f8;font-size:11px;color:#8a9ab1}.row-top h3{font-size:14px;margin:0}.row-top p{margin:4px 0 0;color:#8e9db2;font-size:10px}.amount{margin-left:auto;text-align:right;color:#385778;font-weight:650}.amount small{display:block;color:#99a6b9;font-size:10px;font-weight:400;margin-top:3px}.empty-state{text-align:center;padding:40px 12px;color:#8c9ab0;font-size:12px}.totals{display:flex;justify-content:space-between;align-items:end;background:linear-gradient(125deg,#2469ee,#5e94f5);border-radius:18px;padding:20px;color:white}.totals small{display:block;opacity:.8;font-size:11px}.totals strong{display:block;font-size:27px;letter-spacing:.3px;margin-top:4px}.totals span{font-size:11px;opacity:.8}.top-back{width:35px;height:35px;background:#eef4ff;color:var(--blue);border-radius:11px;font-size:24px}.nav a{width:25%;text-align:center;text-decoration:none;color:#91a1b8;font-size:11px;padding:8px}.nav a.active{color:var(--blue);font-weight:650}.stock-summary{display:grid;grid-template-columns:1fr 1fr;gap:11px}.stock-summary div{background:white;border-radius:15px;border:1px solid #e9eef7;padding:17px}.stock-summary small{font-size:11px;color:#8e9eb5;display:block}.stock-summary strong{font-size:24px;display:block;margin-top:7px}.stock-summary em{font-size:11px;font-style:normal;color:#96a6ba;margin-left:4px}.detail-row b{font-weight:500;max-width:65%;text-align:right}.row-card:focus-visible{outline:3px solid #aac7ff}.badge{white-space:nowrap}.stock-chip{display:inline-block;padding:3px 7px;background:#fff4e5;color:#ad7a2e;border-radius:5px;font-size:10px}.meta-note{font-size:10px;line-height:1.8;color:#90a0b6;margin:12px 0}.two input{min-width:0}
</style></head><body><div class="preview-label">库存 · 收付款 · 供货商 · 交互方案预览</div><div class="phone"><header class="header"><div class="top"><button class="top-back" onclick="location.href='index.html'" aria-label="返回总台">‹</button><div><div class="brand">曙 光 库 存</div><h1 id="title"></h1></div><button id="top-action" class="action" style="margin-left:auto"></button></div><div class="meta"><span id="subtitle"></span><span class="synced">● 演示数据</span></div></header><main class="content" id="content"></main><nav class="nav"><a href="index.html">⌂ 总台</a><a id="nav-stock" href="?view=stock">库存</a><a id="nav-finance" href="?view=finance">收付款</a><a id="nav-suppliers" href="?view=suppliers">供货商</a></nav></div><div id="modal" class="backdrop hidden" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title"></h2><button class="close" aria-label="关闭" onclick="closeSheet()">×</button></div><div id="sheet-body"></div></section></div><div id="toast" role="status" class="toast hidden"></div><script src="preview-store.js"></script><script src="dimension-input.js"></script><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'¥'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let db=PreviewStore.read(),view=new URLSearchParams(location.search).get('view')||'stock',filter='all',query='',toastTimer,restoreFocus;if(!['stock','finance','suppliers'].includes(view))view='stock';
function persist(){PreviewStore.write(db)}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function sheet(title,body){restoreFocus=document.activeElement;$('sheet-title').textContent=title;$('sheet-body').innerHTML=body;$('modal').classList.remove('hidden');document.body.style.overflow='hidden';document.querySelector('.close').focus()}function closeSheet(){$('modal').classList.add('hidden');document.body.style.overflow='';restoreFocus?.focus()}
document.addEventListener('keydown',e=>{if($('modal').classList.contains('hidden'))return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){let a=[...$('modal').querySelectorAll('button,input,select')],f=a[0],l=a[a.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});
function entryTimeField(){return field('入库日期和时间（实际到货时间）','entry-at',localDateTime(),'datetime-local')}function localDateTime(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function readEntryTime(){let v=$('entry-at').value;if(!v||!Number.isFinite(new Date(v).getTime())){toast('请选择有效入库日期和时间');return null}return v.replace('T',' ')}function field(label,id,value='',type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}function search(placeholder){return `<input class="search" id="search" aria-label="${placeholder}" placeholder="${placeholder}" value="${esc(query)}" oninput="query=this.value;renderList()">`}function pills(items){return '<div class="pills">'+items.map(([key,label])=>`<button id="f-${key}" onclick="filter='${key}';renderList()">${label}</button>`).join('')+'</div>'}function detail(label,value){return `<div class="detail-row"><span>${label}</span><b>${esc(value)}</b></div>`}function demo(){return '<div class="demo">演示数据 · 仅保存在此浏览器，不写入真实业务</div>'}
function render(){db=PreviewStore.read();for(let k of ['stock','finance','suppliers'])$('nav-'+k).classList.toggle('active',k===view);let action=$('top-action');if(view==='stock'){$('title').textContent='库存管理';$('subtitle').textContent='原料与成品分开看，每次数量都有来处';action.textContent='入库';action.onclick=()=>stockEntry();let board=db.stock.filter(s=>s.kind==='board'),carton=db.stock.filter(s=>s.kind==='carton');$('content').innerHTML=`<div class="stock-summary"><div><small>纸板原料</small><strong>${board.reduce((a,s)=>a+s.qty,0).toLocaleString()}<em>张</em></strong><span class="hint">${board.length} 个批次</span></div><div><small>纸箱成品</small><strong>${carton.reduce((a,s)=>a+s.qty,0).toLocaleString()}<em>个</em></strong><span class="hint">${carton.length} 种规格</span></div></div>`+search('搜索货名、尺寸、供货商')+pills([['all','全部库存'],['board','纸板'],['carton','纸箱'],['warning','库存预警']])+'<div id="list"></div>'+demo()}else if(view==='finance'){$('title').textContent='收付款';$('subtitle').textContent='按往来对象办理，金额自动带出';action.textContent='记一笔';action.onclick=()=>settle();$('content').innerHTML=`<div class="totals"><div><small>客户待收款</small><strong>${money(db.customers.reduce((a,c)=>a+c.balance,0))}</strong></div><div style="text-align:right"><small>供货商待付款</small><b style="font-size:18px">${money(db.suppliers.reduce((a,c)=>a+c.balance,0))}</b></div></div>`+search('搜索客户、供货商或收付款记录')+pills([['all','全部往来'],['receive','待收款'],['pay','待付款'],['records','收支流水']])+'<div id="list"></div>'+demo()}else{$('title').textContent='供货商管理';$('subtitle').textContent='常购规格、到货与付款集中管理';action.textContent='＋ 新增';action.onclick=()=>editSupplier();$('content').innerHTML=`<div class="totals"><div><small>合作供货商</small><strong>${db.suppliers.length}<span> 家</span></strong></div><div style="text-align:right"><small>待付合计</small><b style="font-size:19px">${money(db.suppliers.reduce((a,c)=>a+c.balance,0))}</b></div></div>`+search('搜索供货商、联系人、手机')+pills([['all','全部供货商'],['pinned','常用'],['debt','待付款']])+'<div id="list"></div>'+demo()}renderList()}
function renderList(){document.querySelectorAll('.pills button').forEach(b=>b.classList.toggle('active',b.id==='f-'+filter));let list=[],q=query.trim().toLowerCase(),matches=values=>values.join(' ').toLowerCase().includes(q);if(view==='stock'){list=db.stock.filter(s=>(filter==='all'||filter===s.kind||(filter==='warning'&&s.qty<=s.safety))&&matches([s.name,s.size,s.supplier,s.customerName||db.customers.find(c=>c.id===s.customerId)?.name||'']));$('list').innerHTML=list.map(s=>`<button class="row-card" onclick="stockDetail(${s.id})"><div class="row-top"><span class="avatar">${s.kind==='board'?'板':'箱'}</span><div><h3>${esc(s.name)}</h3><p>${esc(s.size)}</p><p>入库：${esc(s.lastInboundAt||s.enteredAt||'历史数据未记录时间')}</p>${s.kind==='board'?'<p>入库金额：'+(s.totalAmount==null?'未记录 / 待核算':money(s.totalAmount))+'</p>':''}</div><div class="amount">${s.qty.toLocaleString()}<small>${s.unit}</small></div></div><div class="row-bottom"><span>客户：${esc(s.customerName||db.customers.find(c=>c.id===s.customerId)?.name||'公共备货')}<br>供货来源：${esc(s.supplier||(s.kind==='carton'?'自产 / 未关联供货商':'未关联供货商'))}<br>库位：${esc(s.location)}</span>${s.qty<=s.safety?'<span class="stock-chip">低于安全库存</span>':(s.pricingPending?'<span class="stock-chip">金额待核算</span>':'<span>查看明细 ›</span>')}</div></button>`).join('')}else if(view==='suppliers'){list=db.suppliers.filter(s=>(filter!=='pinned'||s.pinned)&&(filter!=='debt'||s.balance>0)&&matches([s.name,s.person,s.phone]));$('list').innerHTML=list.map(s=>`<button class="row-card" onclick="supplierDetail(${s.id})"><div class="row-top"><span class="avatar">${esc(s.name[0])}</span><div><h3>${esc(s.name)} ${s.pinned?'★':''}</h3><p>${esc(s.person)} · ${esc(s.phone)}</p></div><span style="margin-left:auto;color:#a1aec1">›</span></div><div class="row-bottom"><span>常购规格 ${s.specs.length} 种</span><span>待付 <b style="color:#b38135">${money(s.balance)}</b></span></div></button>`).join('')}else if(filter==='records'){list=db.records.filter(r=>matches([r.party,r.label,r.note]));$('list').innerHTML=list.map(r=>`<div class="row-card"><div class="row-top"><span class="avatar">${r.type==='receive'?'收':'付'}</span><div><h3>${esc(r.party)}</h3><p>${esc(r.label)} · ${esc(r.time)}</p></div><div class="amount" style="color:${r.type==='receive'?'#3b997e':'#bd8750'}">${r.type==='receive'?'+':'−'}${money(r.amount)}</div></div><div class="row-bottom"><span>${esc(r.note||'已关联往来余额')}</span><span>已登记</span></div></div>`).join('')}else{let parties=[...db.customers.map(c=>({...c,type:'receive'})),...db.suppliers.map(c=>({...c,type:'pay'}))];list=parties.filter(c=>c.balance>0&&(filter==='all'||filter===c.type)&&matches([c.name,c.person,c.phone]));$('list').innerHTML=list.map(c=>`<div class="row-card"><div class="row-top"><span class="avatar">${c.type==='receive'?'客':'供'}</span><div><h3>${esc(c.name)}</h3><p>${c.type==='receive'?'客户应收':'供货商应付'} · 余额自动带入</p></div><div class="amount">${money(c.balance)}</div></div><div class="row-bottom"><span>支持部分${c.type==='receive'?'收款':'付款'}</span><button class="action" onclick="settle('${c.type}',${c.id})">登记${c.type==='receive'?'收款':'付款'}</button></div></div>`).join('')}if(!list.length)$('list').innerHTML='<div class="empty-state">暂无匹配记录</div>'}
function stockDetail(id){let s=db.stock.find(s=>s.id===id),logs=db.stockLogs.filter(l=>l.stockId===id);sheet(s.name,detail('规格',s.size)+detail('入库日期时间',s.enteredAt||'历史数据未记录')+(s.lastInboundAt?detail('最近补入时间',s.lastInboundAt):'')+detail('系统登记时间',s.recordedAt||'历史数据未记录')+(s.kind==='board'?detail('入库金额',s.totalAmount==null?'未记录 / 待核算':money(s.totalAmount))+(s.price!=null?detail('采购单价',money(s.price)+' / '+(s.priceUnit==='元/㎡'?'㎡':'张')):'')+(s.totalArea!=null?detail('总面积',s.totalArea.toFixed(4)+' ㎡'):''):'')+detail('当前库存',s.qty+' '+s.unit)+(s.pricingPending?detail('计价状态','面积 / 金额待核算，未记应付'):'')+detail('安全库存',s.safety+' '+s.unit)+detail('库位',s.location)+detail('关联客户',s.customerName||db.customers.find(c=>c.id===s.customerId)?.name||'公共备货')+detail('供货来源',s.supplier||(s.kind==='carton'?'自产 / 未关联供货商':'未关联供货商'))+'<p>数量变化记录</p>'+logs.map(l=>detail(l.label+(l.enteredAt?' · '+l.enteredAt:''),l.delta>0?'+'+l.delta+' '+s.unit:l.delta+' '+s.unit)).join('')+(logs.length?'':'<p class="hint">示例期初库存，暂无本次操作流水。</p>')+`<div class="two"><button class="primary" onclick="stockEntry(${id})">同规格入库</button><button class="primary" style="background:#edf3ff;color:#2469ee;box-shadow:none" onclick="stocktake(${id})">库存盘点</button></div>`)}
function stocktake(id){let s=db.stock.find(s=>s.id===id);sheet('盘点 · '+s.name,'<p>只填实盘数量，系统自动计算调整差额并留记录。</p>'+detail('账面数量',s.qty+' '+s.unit)+field('实盘数量（'+s.unit+'）','count',s.qty,'number')+field('调整说明（必填）','reason','')+`<button class="primary" onclick="saveCount(${id})">确认盘点</button>`)}
function saveCount(id){let n=Number($('count').value),reason=$('reason').value.trim(),s=db.stock.find(s=>s.id===id);if(!$('count').value||!Number.isInteger(n)||n<0||!reason){toast('填写非负整数数量和调整说明');return}if(n===s.qty){toast('数量一致，无需调整');return}db.stockLogs.unshift({stockId:id,label:'盘点 · '+reason,delta:n-s.qty});s.qty=n;persist();closeSheet();render();toast('演示库存已调整，盘点差额已留存')}
function stockEntry(id){if(!id){sheet('选择入库方式','<p>已有规格直接复用，也可以自定义新纸板规格。</p><button class="primary" onclick="customBoard()">＋ 自定义纸板入库</button><button class="primary" style="background:#edf3ff;color:#2469ee;box-shadow:none" onclick="stockEntry(-1)">选择已有货物入库</button><button class="primary" onclick="cartonEntry()">＋ 纸箱入库</button>');return}if(id===-1)id=undefined;let options=id?db.stock.filter(s=>s.id===id):db.stock;sheet('库存入库','<p>选已有规格直接带出资料。这里为库存登记演示，不生成采购或生产单。</p><div class="field"><label>入库货物</label><select id="entry-stock">'+options.map(s=>`<option value="${s.id}">${esc(s.name+' · '+s.size)}</option>`).join('')+'</select></div>'+field('本次实际入库数量','entry-qty','','number')+entryTimeField()+field('入库说明（必填）','entry-note','')+'<div class="flow-note">同批已通过生产入库的纸箱不用再录。纸箱直接入库不会扣纸板。</div><button class="primary" onclick="saveEntry()">确认入库 · 记录数量变化</button>')}
function saveEntry(){let enteredAt=readEntryTime();if(!enteredAt)return;let id=Number($('entry-stock').value),qty=Number($('entry-qty').value),note=$('entry-note').value.trim();if(!Number.isInteger(qty)||qty<=0||!note){toast('填写正整数数量及入库说明');return}let s=db.stock.find(s=>s.id===id);s.qty+=qty;s.lastInboundAt=enteredAt;db.stockLogs.unshift({stockId:id,label:'入库 · '+note,delta:qty,enteredAt,recordedAt:localDateTime().replace('T',' ')});persist();closeSheet();render();toast('演示入库已保存，可查看关联库存记录')}
function settle(type='receive',id){let pool=type==='receive'?db.customers:db.suppliers;if(id===undefined){let c=pool.find(c=>c.balance>0);id=c?.id}let c=pool.find(c=>c.id===id);sheet('登记'+(type==='receive'?'收款':'付款'),'<p>已有往来余额直接带出，核对实际到账或付出金额。</p><div class="pills"><button class="'+(type==='receive'?'active':'')+'" onclick="settle(\'receive\')">客户收款</button><button class="'+(type==='pay'?'active':'')+'" onclick="settle(\'pay\')">供货商付款</button></div><div class="field"><label>往来对象</label><select id="party" onchange="updateBalance(\''+type+'\')">'+pool.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)}</option>`).join('')+'</select></div><div class="flow-note" id="balance-note">当前待结 '+money(c?.balance||0)+'</div>'+field('实际'+(type==='receive'?'收款':'付款')+'金额（元）','settle-amount',c?.balance||'','number')+'<div class="field"><label>结算方式</label><select id="method"><option>银行转账</option><option>微信</option><option>支付宝</option><option>现金</option></select></div>'+field('备注','settle-note','')+`<button class="primary" onclick="saveSettlement('${type}')">确认${type==='receive'?'收款':'付款'} · 更新往来余额</button>`)}
function updateBalance(type){let pool=type==='receive'?db.customers:db.suppliers,c=pool.find(c=>c.id===Number($('party').value));$('balance-note').textContent='当前待结 '+money(c.balance);$('settle-amount').value=c.balance||''}
function saveSettlement(type){let pool=type==='receive'?db.customers:db.suppliers,c=pool.find(c=>c.id===Number($('party').value)),n=Number($('settle-amount').value);if(!Number.isFinite(n)||n<=0||n>c.balance||Math.abs(n*100-Math.round(n*100))>1e-6){toast('金额需大于零，不超过待结余额，最多两位小数');return}c.balance=Math.round((c.balance-n)*100)/100;db.records.unshift({id:Date.now(),type,partyId:c.id,party:c.name,amount:n,label:$('method').value,note:$('settle-note').value.trim(),time:'刚刚'});persist();closeSheet();render();toast('已模拟'+(type==='receive'?'收款':'付款')+'，往来余额与流水同步更新')}
function supplierDetail(id){let s=db.suppliers.find(s=>s.id===id);sheet(s.name,detail('联系人',s.person+' · '+s.phone)+detail('地址',s.address)+detail('当前待付',money(s.balance))+'<div class="section-head" style="margin-top:20px"><h2>常购纸板规格</h2><button class="action" onclick="addSupplierSpec('+id+')">＋ 添加</button></div>'+s.specs.map((sp,i)=>`<div class="row-card"><div class="row-top"><div><h3>${esc(sp.name)}</h3><p>${esc(sp.size)} · 参考价 ${money(sp.price)} / ${sp.priceUnit==='元/㎡'?'㎡':'张'}</p></div></div><div class="row-bottom"><span>规格和价格直接带出</span><button class="action" onclick="supplierReceive(${id},${i})">到货入库</button></div></div>`).join('')+`<div class="two"><button class="primary" style="background:#edf3ff;color:#2469ee;box-shadow:none" onclick="editSupplier(${id})">编辑资料</button><button class="primary" onclick="settle('pay',${id})">登记付款</button></div>`)}
function editSupplier(id){let s=db.suppliers.find(s=>s.id===id)||{};sheet(id?'编辑供货商':'新增供货商',field('供货商名称（必填）','supplier-name',s.name)+field('联系人','supplier-person',s.person)+field('手机号码','supplier-phone',s.phone,'tel')+field('地址','supplier-address',s.address)+`<button class="primary" onclick="saveSupplier(${id||0})">保存供货商</button>`)}
function saveSupplier(id){let name=$('supplier-name').value.trim();if(!name||db.suppliers.some(s=>s.name===name&&s.id!==id)){toast('请填写供货商名称，名称不能重复');return}let data={name,person:$('supplier-person').value.trim(),phone:$('supplier-phone').value.trim(),address:$('supplier-address').value.trim()};if(id)Object.assign(db.suppliers.find(s=>s.id===id),data);else db.suppliers.push({...data,id:Math.max(0,...db.suppliers.map(s=>s.id))+1,balance:0,pinned:false,specs:[]});persist();closeSheet();render();toast('供货商资料已在预览中保存')}
function addSupplierSpec(id){sheet('添加常购规格',field('纸板名称（必填）','sp-name','五层 BC 楞纸板')+field('尺寸（必填）','sp-size','','text')+field('参考采购价（元 / 张）','sp-price','','number')+`<button class="primary" onclick="saveSupplierSpec(${id})">保存常购规格</button>`)}
function saveSupplierSpec(id){let name=$('sp-name').value.trim(),size=$('sp-size').value.trim(),price=Number($('sp-price').value);if(!name||!size||!$('sp-price').value||!Number.isFinite(price)||price<0){toast('填写名称、尺寸和有效参考价');return}db.suppliers.find(s=>s.id===id).specs.push({name,size,price});persist();supplierDetail(id);toast('常购规格已保存')}
function supplierReceive(id,index){let s=db.suppliers.find(s=>s.id===id),sp=s.specs[index];sheet('供货商到货入库','<p>本次演示按实际到货生成库存和应付，不会自动发生付款。</p>'+detail('供货商',s.name)+detail('货物规格',sp.name+' · '+sp.size)+field('实收数量（张）','sr-qty','','number')+field('本次单价（'+(sp.priceUnit==='元/㎡'?'元 / ㎡':'元 / 张')+'）','sr-price',sp.price,'number')+entryTimeField()+field('库位','sr-location','原料区 A-01')+`<button class="primary" onclick="saveSupplierReceive(${id},${index})">确认到货 · 增库存并记应付</button>`)}
function saveSupplierReceive(id,index){let enteredAt=readEntryTime();if(!enteredAt)return;let s=db.suppliers.find(s=>s.id===id),sp=s.specs[index],qty=Number($('sr-qty').value),price=Number($('sr-price').value),location=$('sr-location').value.trim();if(!Number.isInteger(qty)||qty<=0||!$('sr-price').value||!Number.isFinite(price)||price<0||Math.abs(price*100-Math.round(price*100))>1e-6){toast('核对实收数量和单价，单价最多两位小数');return}let item={id:Math.max(0,...db.stock.map(s=>s.id))+1,kind:'board',name:sp.name,size:sp.size,supplier:s.name,qty,unit:'张',location:location||'未设库位',safety:0,enteredAt,recordedAt:localDateTime().replace('T',' ')};db.stock.push(item);db.stockLogs.unshift({stockId:item.id,label:s.name+' · 到货入库',delta:qty,enteredAt,recordedAt:localDateTime().replace('T',' ')});s.balance=Math.round((s.balance+Math.round(qty*(length*width/10000)*price*100)/100)*100)/100;persist();closeSheet();render();toast('已模拟到货：新增纸板批次，同步增加供货商应付')}
function customBoard(){sheet('自定义纸板入库','<p>先选客户常用资料，已有纸板尺寸直接带入；也可填写新规格。</p><div class="field"><label>客户资料（选填）</label><select id="cb-customer" onchange="loadCustomerSpecs()"><option value="">不引用客户资料</option>'+db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')+'</select></div><div class="field"><label>客户常用货物</label><select id="cb-customer-spec" onchange="applyCustomerSpec()"><option value="">先选择客户</option></select></div><div id="cb-customer-hint" class="flow-note">成箱尺寸与纸板尺寸不同；没有纸板尺寸时需核对后补充一次。</div><div class="field"><label>供货商（选填）</label><select id="cb-supplier"><option value="">不关联供货商 · 只登记库存</option>'+db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')+'</select></div>'+field('纸箱尺寸：长 × 宽 × 高（cm）','cb-carton','')+field('纸板名称（必填）','cb-name','纸板')+'<details style="margin:14px 0"><summary style="color:#7e90a8;font-size:12px;cursor:pointer">采购纸板尺寸 · 查看 / 调整</summary><p class="meta-note">已有对应纸板尺寸会自动带出。可以不填，先登记库存；面积和金额标记待核算，补齐前不增加应付。</p><div class="two">'+field('实际纸板长（cm，选填）','cb-length','','number')+field('实际纸板宽（cm，选填）','cb-width','','number')+'</div></details><div class="two"><div class="field"><label>层数</label><select id="cb-layers"><option>三层</option><option selected>五层</option><option>七层</option></select></div>'+field('楞型（可自定义）','cb-flute','BC')+'</div>'+field('材质 / 配纸（选填）','cb-material','')+'<div class="two">'+field('实收数量（张）','cb-qty','','number')+field('纸板单价（元 / ㎡）','cb-price','','number')+'</div>'+field('库位（选填）','cb-location','')+field('本次入库总金额（元，可直接填送货单金额）','cb-total','','number')+'<div class="meta-note">有纸板面积时自动计算；没有面积也可直接填写总金额，按该金额登记供货商应付。</div>'+entryTimeField()+field('送货单号（选填）','cb-no','')+'<div id="cb-cost" class="flow-note" style="margin-bottom:12px">面积与金额：填写纸板长宽、数量及每平方米单价后自动计算。</div><label style="display:flex;gap:8px;font-size:12px;color:#71849e"><input id="cb-save" type="checkbox" checked>保存为该供货商常购规格</label><div class="meta-note">入库总金额优先使用手填金额，否则按面积计算；有金额并关联供货商时增加应付。实际付款单独登记。</div><button class="primary" onclick="saveCustomBoard()">确认纸板入库</button>');for(let id of ['cb-length','cb-width','cb-qty','cb-price'])$(id).addEventListener('input',updateBoardCost)}
function loadCustomerSpecs(){let c=db.customers.find(c=>c.id===Number($('cb-customer').value));$('cb-customer-spec').innerHTML='<option value="">选择客户货物</option>'+(c?c.specs.map((sp,i)=>`<option value="${i}">${esc(sp.name+' · '+sp.size)}</option>`).join(''):'');$('cb-customer-hint').textContent=c?'选择货物后带入已保存的纸板资料；不会直接把成箱尺寸当纸板尺寸。':'成箱尺寸与纸板尺寸不同；没有纸板尺寸时需核对后补充一次。'}
function applyCustomerSpec(){let c=db.customers.find(c=>c.id===Number($('cb-customer').value)),v=$('cb-customer-spec').value;if(!c||v==='')return;let sp=c.specs[Number(v)];$('cb-carton').value=sp.size||'';$('cb-length').value=sp.boardLength||'';$('cb-width').value=sp.boardWidth||'';if(sp.boardLayers)$('cb-layers').value=sp.boardLayers;$('cb-flute').value=sp.boardFlute||(sp.material||'').match(/([A-Z]+)\s*楞/)?.[1]||'';$('cb-material').value=sp.boardMaterial||'';$('cb-customer-hint').textContent='客户成品：'+sp.name+' · '+sp.size+(sp.boardLength&&sp.boardWidth?'；已带出对应纸板尺寸。':'；尚未保存对应纸板尺寸，请核对补充，本次保存后下次直接带出。');updateBoardCost()}
function updateBoardCost(){let l=Number($('cb-length').value),w=Number($('cb-width').value),q=Number($('cb-qty').value),p=Number($('cb-price').value);let area=l*w/10000;$('cb-cost').textContent=l>0&&w>0?'每张 '+area.toFixed(4)+' ㎡ · 合计 '+(area*q).toFixed(4)+' ㎡ · 金额 '+money(area*q*p):'待带入对应纸板尺寸；新规格可在“采购纸板尺寸”中补充一次'}
function saveCustomBoard(){let totalText=$('cb-total').value.trim(),manualTotal=totalText===''?null:Number(totalText);if(manualTotal!==null&&(!Number.isFinite(manualTotal)||manualTotal<0||!Number.isSafeInteger(Math.round(manualTotal*100))||Math.abs(manualTotal*100-Math.round(manualTotal*100))>1e-6)){toast('入库总金额需为非负数，最多两位小数');$('cb-total').focus();return}let enteredAt=readEntryTime();if(!enteredAt)return;let supplier=db.suppliers.find(s=>s.id===Number($('cb-supplier').value)),name=$('cb-name').value.trim(),length=Number($('cb-length').value),width=Number($('cb-width').value),qty=Number($('cb-qty').value),price=Number($('cb-price').value),flute=$('cb-flute').value.trim();let hasArea=Number.isFinite(length)&&length>0&&Number.isFinite(width)&&width>0;if(!flute){$('cb-flute').focus();toast('请填写纸板楞型');return}if(!name){$('cb-name').focus();toast('请填写纸板名称');return}if(!Number.isInteger(qty)||qty<=0){$('cb-qty').focus();toast('请填写大于零的整数入库张数');return}if((!$('cb-price').value&&manualTotal===null)||!Number.isFinite(price)||price<0||Math.abs(price*100-Math.round(price*100))>1e-6){$('cb-price').focus();toast('请填写有效平方米单价，最多两位小数');return}if(!name||!flute||!Number.isInteger(qty)||qty<=0||(!$('cb-price').value&&manualTotal===null)||!Number.isFinite(price)||price<0||Math.abs(price*100-Math.round(price*100))>1e-6||!Number.isSafeInteger(Math.round(qty*(length*width/10000)*price*100))){toast('核对名称、尺寸、楞型、数量及单价；单价最多两位小数');return}let size=hasArea?length+' × '+width+' cm':($('cb-carton').value.trim()?'成箱 '+$('cb-carton').value.trim():'纸板尺寸未填'),fullName=$('cb-layers').value+' '+flute+' 楞 · '+name,material=$('cb-material').value.trim(),item={id:Math.max(0,...db.stock.map(s=>s.id))+1,kind:'board',name:fullName,size,supplier:supplier?.name||'',qty,unit:'张',location:$('cb-location').value.trim()||'未设库位',safety:0,material,deliveryNo:$('cb-no').value.trim(),price,priceUnit:'元/㎡',cartonSize:$('cb-carton').value.trim(),areaPerSheet:hasArea?length*width/10000:null,totalArea:hasArea?qty*length*width/10000:null,totalAmount:manualTotal!==null?manualTotal:hasArea?Math.round(qty*length*width/10000*price*100)/100:null,amountSource:manualTotal!==null?'手填送货单金额':'面积计算',pricingPending:manualTotal===null&&!hasArea,enteredAt,recordedAt:localDateTime().replace('T',' ')};db.stock.push(item);db.stockLogs.unshift({stockId:item.id,label:'自定义纸板入库'+(item.deliveryNo?' · '+item.deliveryNo:''),delta:qty,enteredAt,recordedAt:localDateTime().replace('T',' ')});if(supplier){if(item.totalAmount!==null)supplier.balance=Math.round((supplier.balance+item.totalAmount)*100)/100;if($('cb-save').checked){let sp=supplier.specs.find(s=>s.name===fullName&&s.size===size);if(sp){sp.price=price;sp.priceUnit='元/㎡'}else supplier.specs.push({name:fullName,size,price,material,priceUnit:'元/㎡'})}}let customer=db.customers.find(c=>c.id===Number($('cb-customer').value)),specIndex=$('cb-customer-spec').value;if(customer&&specIndex!==''){let sp=customer.specs[Number(specIndex)];Object.assign(sp,{boardLength:hasArea?length:sp.boardLength,boardWidth:hasArea?width:sp.boardWidth,boardLayers:$('cb-layers').value,boardFlute:flute,boardMaterial:material,size:$('cb-carton').value.trim()||sp.size});item.customerId=customer.id;item.customerName=customer.name;item.customerSpecIndex=Number(specIndex)}persist();closeSheet();render();toast(item.pricingPending?'已入库；金额待核算，暂未增加应付':supplier?'纸板已入库，供货商应付与常购资料已处理':'纸板已入库，未生成供货商应付')}
function cartonEntry(){sheet('纸箱入库','<p>客户与供货来源随本次批次保存。入库金额记成本，不增加客户应收。</p><div class="field"><label>关联客户</label><select id="ci-customer" onchange="cartonGoods()"><option value="">公共备货</option>'+db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')+'</select></div><div class="field"><label>客户常用货物</label><select id="ci-good" onchange="cartonGoodApply()"><option value="">选择客户后带出</option></select></div>'+field('纸箱名称（必填）','ci-name','')+field('长 × 宽 × 高 / 规格（必填）','ci-size','')+'<div class="field"><label>供货来源</label><select id="ci-supplier"><option value="">自产 / 不关联供货商</option>'+db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')+'</select></div>'+field('实际入库数量（个）','ci-qty','','number')+field('入库成本总金额（元，选填）','ci-total','','number')+entryTimeField()+field('库位','ci-location','成品区')+'<div class="flow-note">此入口直接登记成品，不扣纸板。成本金额不作为客户销售价；供货商采购成本在关联供货商时记应付。</div><button class="primary" onclick="saveCartonEntry()">确认纸箱入库</button>')}
function cartonGoods(){let c=db.customers.find(c=>c.id===Number($('ci-customer').value));$('ci-good').innerHTML='<option value="">选择常用货物或手动填写</option>'+(c?c.specs.map((s,i)=>`<option value="${i}">${esc(s.name+' · '+s.size)}</option>`).join(''):'');$('ci-name').value='';$('ci-size').value=''}
function cartonGoodApply(){let c=db.customers.find(c=>c.id===Number($('ci-customer').value)),i=$('ci-good').value;if(!c||i==='')return;let s=c.specs[Number(i)];$('ci-name').value=s.name;$('ci-size').value=s.size}
function saveCartonEntry(){let name=$('ci-name').value.trim(),size=$('ci-size').value.trim(),qty=Number($('ci-qty').value),raw=$('ci-total').value.trim(),amount=raw===''?null:Number(raw),enteredAt=readEntryTime();if(!enteredAt)return;if(!name||!size||!Number.isSafeInteger(qty)||qty<=0||amount!==null&&(!Number.isFinite(amount)||amount<0||!Number.isSafeInteger(Math.round(amount*100))||Math.abs(amount*100-Math.round(amount*100))>1e-6)){toast('核对货物、规格、数量及成本金额');return}let c=db.customers.find(c=>c.id===Number($('ci-customer').value)),supplier=db.suppliers.find(s=>s.id===Number($('ci-supplier').value));let item={id:Math.max(0,...db.stock.map(s=>s.id))+1,kind:'carton',name,size,qty,unit:'个',safety:0,location:$('ci-location').value.trim()||'未设库位',customerId:c?.id||null,customerName:c?.name||'',supplier:supplier?.name||'',supplierId:supplier?.id||null,totalAmount:amount,pricingPending:amount===null,enteredAt,recordedAt:localDateTime().replace('T',' ')};db.stock.push(item);db.stockLogs.unshift({stockId:item.id,label:'纸箱入库 · '+(c?.name||'公共备货'),delta:qty,enteredAt,recordedAt:item.recordedAt});if(supplier&&amount!==null)supplier.balance=Math.round((supplier.balance+amount)*100)/100;persist();closeSheet();render();toast('纸箱批次已保存，客户和供货来源可在库存查看；未增加客户应收')}
window.addEventListener('storage',e=>{if(e.key===PreviewStore.key){closeSheet();render()}});render();if(new URLSearchParams(location.search).get('action')==='board-in')customBoard();if(new URLSearchParams(location.search).get('action')==='carton-in')cartonEntry();
</script></body></html>
