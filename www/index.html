<!doctype html><html><head><meta content="text/html; charset=utf-8" http-equiv="Content-Type"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-touch-fullscreen" content="yes"/><meta name="format-detection" content="telephone=no,address=no"/><meta name="apple-mobile-web-app-status-bar-style" content="white"/><meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/><title>曙光</title><script>// 按设备宽度自适应 rem：750rpx = 20rem = 视口宽度（所有端等比缩放）
      (function() {
        var set = function() {
          var w = document.documentElement.getBoundingClientRect().width;
          document.documentElement.style.fontSize = (w / 20) + 'px';
        };
        set();
        window.addEventListener('resize', set);
      })();</script><script defer="defer" src="/js/426.354af88a.js"></script><script defer="defer" src="/js/app.354af88a.js"></script><link href="/css/app.354af88a0b70e2e70f4d.css" rel="stylesheet"></head><body><div id="app"></div></body></html>
