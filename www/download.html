<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>曙光 - 安装包下载</title>
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; color: #202923; background: #f5f7f6; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 20px 24px; border-bottom: 1px solid #dce4de; background: #fff; font-size: 14px; color: #526159; }
    main { width: min(100%, 520px); margin: 48px auto; padding: 0 24px; }
    .identity { display: flex; align-items: center; gap: 18px; margin-bottom: 32px; }
    .app-icon { width: 72px; height: 72px; border-radius: 8px; object-fit: contain; flex: none; }
    h1 { margin: 0; font-size: 28px; }
    .subtitle { margin: 2px 0 0; color: #617068; font-size: 14px; }
    dl { margin: 0 0 28px; border-top: 1px solid #dce4de; }
    dl div { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-bottom: 1px solid #dce4de; }
    dt { color: #617068; }
    dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    .download-btn { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px; color: #fff; background: #17684a; border-radius: 6px; text-decoration: none; font-weight: 600; }
    .download-btn:hover { background: #10583d; }
    a:focus-visible { outline: 3px solid #c07c16; outline-offset: 4px; }
    .status { color: #8a4518; font-size: 14px; min-height: 24px; margin: 14px 0; }
    footer { margin-top: 28px; border-top: 1px solid #dce4de; padding-top: 16px; font-size: 13px; color: #617068; }
    @media (max-width: 380px) { main { padding: 0 18px; margin-top: 32px; } h1 { font-size: 24px; } }
  </style>
</head>
<body>
  <header>曙光仓库管理</header>
  <main>
    <div class="identity">
      <img class="app-icon" src="/download/app-icon.png" alt="" width="72" height="72">
      <div><h1>曙光</h1><p class="subtitle">iOS / Android / Windows 安装包</p></div>
    </div>
    <dl aria-label="安装包信息">
      <div><dt>版本</dt><dd id="version">待查询</dd></div>
      <div><dt>文件大小</dt><dd id="size">待查询</dd></div>
      <div><dt>适用系统</dt><dd id="platform">iOS</dd></div>
      <div><dt>文件名称</dt><dd>shuguang.ipa</dd></div>
    </dl>
    <a href="/shuguang.ipa" download="shuguang.ipa" class="download-btn">下载 IPA 文件</a>
    <a href="/download/shuguang-android.apk" download="shuguang-android.apk" class="download-btn" style="margin-top:12px;background:#2563eb">下载 Android APK</a>
    <a href="/download/shuguang-windows-setup.exe" download="shuguang-windows-setup.exe" class="download-btn" style="margin-top:12px;background:#475569">下载 Windows 安装包</a>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <footer>曙光 · 仓库管理</footer>
  </main>
  <script>
    (async function () {
      var status = document.getElementById('status');
      var controller = new AbortController();
      var timeout = setTimeout(function () { controller.abort(); }, 10000);
      try {
        var response = await fetch('/download/ipa.json', { cache: 'no-store', signal: controller.signal });
        if (!response.ok) throw new Error('Metadata unavailable');
        var info = await response.json();
        if (!info.version || !info.build || !Number.isSafeInteger(info.sizeBytes) || info.sizeBytes <= 0) throw new Error('Invalid metadata');
        document.getElementById('version').textContent = info.version + ' (Build ' + info.build + ')';
        document.getElementById('size').textContent = (info.sizeBytes / 1048576).toFixed(2) + ' MiB';
        document.getElementById('platform').textContent = info.minimumOSVersion ? 'iOS ' + info.minimumOSVersion + '+' : 'iOS';
      } catch (error) {
        document.getElementById('version').textContent = '暂不可用';
        document.getElementById('size').textContent = '暂不可用';
        status.textContent = '安装包信息暂不可用';
      } finally {
        clearTimeout(timeout);
      }
    })();
  </script>
</body>
</html>
